<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🎂 HAPPY 42nd BIRTHDAY!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

    <!-- ▼▼▼ Google Analytics 4 ▼▼▼ -->
    <!-- G-XXXXXXXXXX をあなたの測定IDに変えてください -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
    <!-- ▲▲▲ Google Analytics 4 ▲▲▲ -->

    <link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="c"></canvas>
<script src="./config.js"></script>
<script>
// ==========================================================
//  🎂 HAPPY 42nd BIRTHDAY BALLOON GAME
//  カスタマイズしたい箇所は ★CUSTOM★ で検索してください
// ==========================================================

// CONFIG は config.js で定義されています
// 後方互換のため CUSTOM / STAGES / DEFS / STAGE_UP_MSG は CONFIG から生成
const CUSTOM = {
    ...CONFIG.assets,
    name:     CONFIG.ending.message,
    subtitle: CONFIG.ending.subtitle,
    theme:    CONFIG.theme,
};

const STAGES       = CONFIG.stages;
const STAGE_UP_MSG = CONFIG.stageUpMessages;

// アイテム定義を CONFIG から生成
const DEFS = {};
Object.entries(CONFIG.items).forEach(([k, d]) => {
    DEFS[k] = {
        label:   d.label,
        pts:     d.pts,
        w:       d.w,
        color:   d.color,
        bg:      d.bg,
        hazard:  d.hazard  ?? false,
        special: d.special ?? false,
        slow:    d.slow    ?? false,
    };
});

const R        = 36;    // バルーン半径（px）
const COMBO_MS = 1500;  // コンボリセットまでの時間（ms）

// ── タイミング定数（フレーム数、約 60fps）──────────────────────
const LOADING_FRAMES        = 100;  // ローディング表示
const INTRO_FADE_FRAMES     = 30;  // 動画→暗転フェード
const INTRO_BALLOON_FRAMES  = 210; // バルーンアニメ総フレーム
const INTRO_BALLOON_FADEIN  = 40;  // バルーンアニメ フェードイン
const INTRO_BALLOON_FADEOUT = 20;  // バルーンアニメ フェードアウト
const TITLE_FADE_FRAMES     = 40;  // タイトル画面フェードイン
const STAGE_FLASH_FRAMES    = 160; // ステージアップ吹き出し表示
const STAGE_FLASH_SLIDE     = 22;  // 吹き出しスライドイン/アウト
const START_WAIT_FRAMES     = 60;  // START後・吹き出しまでの待機（約1s）
const START_SLIDE_FRAMES    = 15;  // 吹き出しスライドイン
const START_TOTAL_FRAMES    = 210; // START後・ゲーム開始まで（約3.5s）
const SLOW_FRAMES           = 210; // SLOW効果の持続時間（約3.5s）
const RETICLE_SIZE          = 72;  // レティクル表示サイズ（px、アス比 1:1 維持）

// ── Canvas setup ──────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;
function resize() {
    const aspect = 9 / 16;
    H = Math.min(window.innerHeight, 820);
    W = Math.min(window.innerWidth, H * aspect, 420);
    H = Math.min(H, W / aspect);
    canvas.width  = Math.floor(W);
    canvas.height = Math.floor(H);
    W = canvas.width;
    H = canvas.height;
}
resize();
window.addEventListener('resize', resize);

// ── 画像・動画の読み込み ────────────────────────────────
let fanArtImg  = null;
let bouncerImgs = [];

function loadImg(src) {
    const img = new Image();
    img.src = src;
    return img;
}
if (CUSTOM.fanArtSrc)  fanArtImg  = loadImg(CUSTOM.fanArtSrc);

// bouncerSrc は文字列でも配列でもOK
const bouncerSrcs = CUSTOM.bouncerSrc
    ? (Array.isArray(CUSTOM.bouncerSrc) ? CUSTOM.bouncerSrc : [CUSTOM.bouncerSrc])
    : [];
bouncerImgs = bouncerSrcs.map(s => loadImg(s));

let titleImg        = CUSTOM.titleImgSrc        ? loadImg(CUSTOM.titleImgSrc)        : null;
let titleImgCleared = CUSTOM.titleImgClearedSrc ? loadImg(CUSTOM.titleImgClearedSrc) : null;
let reticleImg      = CUSTOM.reticleSrc         ? loadImg(CUSTOM.reticleSrc)         : null;

// クリア状態（タブを閉じるまで保持）
const CLEARED_KEY = 'sky-burst-42-cleared';
let gameCleared = sessionStorage.getItem(CLEARED_KEY) === '1';
function setCleared() { gameCleared = true;  sessionStorage.setItem(CLEARED_KEY, '1'); }
function resetCleared() { gameCleared = false; sessionStorage.removeItem(CLEARED_KEY); }

// イントロ MP4 ビデオ要素（Canvas の後ろに隠す）
let introVideo = null;
let introVideoEnded = false;
if (CUSTOM.introVideoSrc) {
    introVideo = document.createElement('video');
    introVideo.src          = CUSTOM.introVideoSrc;
    introVideo.muted        = true;   // autoplay には muted 必須
    introVideo.playsInline  = true;
    introVideo.preload      = 'auto';
    introVideo.style.cssText = 'position:fixed;opacity:0;pointer-events:none;width:1px;height:1px';
    document.body.appendChild(introVideo);
    introVideo.addEventListener('ended', () => { introVideoEnded = true; });
}

// ── State ─────────────────────────────────────────────────
let G;
function initState() {
    G = {
        phase:     'loading',
        frame:     0,
        introSub:  'video',  // 'video' | 'fade' | 'balloons'
        introFade: 0,        // フェードオーバーレイ進捗フレーム
        score:     0,
        combo:     1,
        lives:     3,
        si:        0,
        stagePts:  0,
        items:     [],
        particles: [],
        confetti:  [],
        lastPop:   0,
        pool:      buildPool(0),
        stars:     buildStars(),
        bgT:       1,
        bgFrom:    { bg1: STAGES[0].bg1, bg2: STAGES[0].bg2 },
        stageFlash: 0,
        stageFlashMsg: 0,
        introAlpha: 0,
        titleFade:  0,
        slowTimer:  0,   // clock割り後のスロー残りフレーム
        bouncers: [
            { x: 0, y: 0, vx:  1.5, vy: -1.8, size: 72 },
            { x: 0, y: 0, vx: -1.2, vy: -1.6, size: 72 },
        ],
    };
}

function buildStars() {
    return Array.from({length:40}, () => ({
        x: Math.random(),
        y: Math.random() * 0.82,
        r: 0.5 + Math.random() * 1.2,
        ph: Math.random() * Math.PI * 2,
    }));
}

function buildPool(si) {
    const bw = STAGES[si].bombW;
    const pool = [];
    Object.entries(DEFS).forEach(([k, d]) => {
        const wt = d.hazard ? bw : d.w;
        for (let i = 0; i < wt; i++) pool.push(k);
    });
    return pool;
}

// ── Spawn ──────────────────────────────────────────────────
function spawnItem() {
    const type = G.pool[Math.floor(Math.random() * G.pool.length)];
    const def  = DEFS[type];
    const sf   = G.slowTimer > 0 ? 0.55 : 1;
    const spd  = (STAGES[G.si].speed + Math.random() * 0.8) * sf;
    G.items.push({
        type, def,
        x:      R + Math.random() * (W - R * 2),
        y:      H + R + 12,
        vy:     -spd,
        vx:     (Math.random() - 0.5) * 0.4,
        wobble: Math.random() * Math.PI * 2,
        popped: false,
    });
}

// ── Particles ─────────────────────────────────────────────
function burst(x, y, color, n = 12) {
    for (let i = 0; i < n; i++) {
        const a = (Math.PI * 2 / n) * i + Math.random() * 0.5;
        const s = 2 + Math.random() * 5;
        G.particles.push({ type:'dot', x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, r:3+Math.random()*4, color, life:1 });
    }
}
function floatText(x, y, text, color) {
    G.particles.push({ type:'text', x, y, vy:-1.6, vx:0, text, color, life:1 });
}
function spawnConfetti() {
    const cols = [CUSTOM.theme.pink, CUSTOM.theme.gold, CUSTOM.theme.purple, CUSTOM.theme.teal, '#F87171', '#60A5FA'];
    G.confetti = Array.from({length:180}, () => ({
        x:    Math.random() * W,
        y:   -20 - Math.random() * H,
        vy:   1.2 + Math.random() * 2,
        vx:   (Math.random() - 0.5) * 1.5,
        color: cols[Math.floor(Math.random() * cols.length)],
        w:    6 + Math.random() * 8,
        h:    3 + Math.random() * 5,
        rot:  Math.random() * Math.PI,
        rotV: (Math.random() - 0.5) * 0.18,
    }));
}

// ── Pop logic ──────────────────────────────────────────────
function tryPop(px, py) {
    if (G.phase !== 'playing') return;
    for (let i = G.items.length - 1; i >= 0; i--) {
        const it = G.items[i];
        if (it.popped) continue;
        const dx = px - it.x, dy = py - it.y;
        if (dx*dx + dy*dy < R*R*1.8) { it.popped = true; onPop(it); return; }
    }
}

function onPop(it) {
    const now = Date.now();
    if (it.def.hazard) {
        G.combo = 1;
        G.lives = Math.max(0, G.lives - 1);
        burst(it.x, it.y, '#FF4444', 10);
        floatText(it.x, it.y - 20, '💥 MISS!', '#FF4444');
        gaEvent('pop_skull', { stage: G.si + 1 });
        if (G.lives <= 0) setTimeout(() => G.phase = 'gameOver', 400);
    } else {
        G.combo   = (now - G.lastPop < COMBO_MS) ? Math.min(G.combo + 1, 8) : 1;
        G.lastPop = now;
        const pts = it.def.pts * G.combo;
        G.score    += pts;
        G.stagePts += pts;
        burst(it.x, it.y, it.def.color, it.def.special ? 22 : 12);
        if (it.def.slow) {
            if (G.slowTimer === 0) G.items.forEach(t => { if (!t.popped) t.vy *= 0.55; });
            G.slowTimer = SLOW_FRAMES;
            floatText(it.x, it.y - 24, `+${pts}  ⏰SLOW!`, CUSTOM.theme.teal);
        } else {
            floatText(it.x, it.y - 24,
                G.combo > 1 ? `+${pts}  🔥x${G.combo}` : `+${pts}`,
                G.combo > 2 ? CUSTOM.theme.gold : '#FFF');
        }
        gaEvent('pop_item', { type: it.type, combo: G.combo });

        if (G.stagePts >= STAGES[G.si].target) {
            if (G.si >= STAGES.length - 1) {
                setCleared();
                setTimeout(() => { spawnConfetti(); G.phase = 'ending'; }, 350);
                gaEvent('game_complete', { score: G.score });
            } else {
                // シームレスにステージアップ
                G.bgFrom  = { bg1: STAGES[G.si].bg1, bg2: STAGES[G.si].bg2 };
                G.bgT     = 0;
                G.si++;
                G.stagePts = 0;
                G.pool     = buildPool(G.si);
                G.stageFlash    = STAGE_FLASH_FRAMES;
                G.stageFlashMsg = G.si - 1; // メッセージindex（遷移後siから-1）
                gaEvent('stage_clear', { stage: G.si });
            }
        }
    }
}

// ── Analytics ─────────────────────────────────────────────
function gaEvent(name, params = {}) {
    if (typeof gtag === 'function') gtag('event', name, params);
}

// ── Draw helpers ───────────────────────────────────────────
function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w,y,   x+w,y+h, r);
    ctx.arcTo(x+w,y+h, x,  y+h, r);
    ctx.arcTo(x,  y+h, x,  y,   r);
    ctx.arcTo(x,  y,   x+w,y,   r);
    ctx.closePath();
}
function pill(cx, cy, w, h, color) {
    const r = h/2;
    ctx.shadowColor = color;
    ctx.shadowBlur  = 18;
    ctx.fillStyle   = color;
    rrect(cx-w/2, cy-h/2, w, h, r);
    ctx.fill();
    // shine overlay
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    rrect(cx-w/2+2, cy-h/2+2, w-4, (h-4)/2, r);
    ctx.fill();
    ctx.shadowBlur = 0;
}

function lerpHex(a, b, t) {
    const p = s => [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)];
    const [ar,ag,ab] = p(a), [br,bg,bb] = p(b);
    const r = Math.round(ar + (br-ar)*t), g = Math.round(ag + (bg-ag)*t), bv = Math.round(ab + (bb-ab)*t);
    return '#' + [r,g,bv].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function drawBg() {
    const t   = G.bgT ?? 1;
    const cur = STAGES[G.si] ?? STAGES[STAGES.length-1];
    const c1  = G.bgFrom ? lerpHex(G.bgFrom.bg1, cur.bg1, t) : cur.bg1;
    const c2  = G.bgFrom ? lerpHex(G.bgFrom.bg2, cur.bg2, t) : cur.bg2;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, c1);
    grad.addColorStop(1, c2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    // twinkling stars（昼空は薄く、宇宙は明るく）
    const starAlphaBase = G.bgT !== undefined ? 0.08 + 0.62 * (G.si / (STAGES.length - 1)) : 0.7;
    G.stars.forEach(s => {
        const a = Math.sin(G.frame * 0.04 + s.ph) * 0.35 + 0.55;
        ctx.globalAlpha = a * starAlphaBase;
        ctx.beginPath();
        ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
        ctx.fillStyle = '#FFF';
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

function puffyStarPath(cx, cy, outerR, innerR, n) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
        const outerA  = (i * 2 * Math.PI / n) - Math.PI / 2;
        const innerA1 = outerA - Math.PI / n;
        const innerA2 = outerA + Math.PI / n;
        const ix1 = cx + Math.cos(innerA1) * innerR;
        const iy1 = cy + Math.sin(innerA1) * innerR;
        const ox  = cx + Math.cos(outerA)  * outerR;
        const oy  = cy + Math.sin(outerA)  * outerR;
        const ix2 = cx + Math.cos(innerA2) * innerR;
        const iy2 = cy + Math.sin(innerA2) * innerR;
        if (i === 0) ctx.moveTo(ix1, iy1);
        else         ctx.lineTo(ix1, iy1);
        ctx.quadraticCurveTo(ox, oy, ix2, iy2);
    }
    ctx.closePath();
}

function drawBalloon(it) {
    ctx.save();
    if (it.def.slow) {
        // ── clock: 星形 ──────────────────────────────────────
        const bg = ctx.createRadialGradient(it.x - R*0.28, it.y - R*0.28, 2, it.x, it.y, R);
        bg.addColorStop(0, it.def.color + 'EE');
        bg.addColorStop(1, it.def.bg    + 'CC');
        ctx.fillStyle   = bg;
        ctx.shadowColor = it.def.color;
        ctx.shadowBlur  = 16;
        puffyStarPath(it.x, it.y, R, R * 0.52, 5);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = `${R * 0.95}px serif`;
        ctx.fillText(it.def.label, it.x, it.y + 2);
        ctx.textBaseline = 'alphabetic';
        ctx.restore();
        return;
    }
    // string
    if (!it.def.hazard) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.lineWidth   = 1.5;
        ctx.moveTo(it.x, it.y + R);
        ctx.lineTo(it.x, it.y + R + 14);
        ctx.stroke();
    }
    // body
    const bg = ctx.createRadialGradient(it.x - R*0.28, it.y - R*0.28, 2, it.x, it.y, R);
    bg.addColorStop(0, it.def.color + 'EE');
    bg.addColorStop(1, it.def.bg    + 'CC');
    ctx.beginPath();
    ctx.arc(it.x, it.y, R, 0, Math.PI*2);
    ctx.fillStyle   = bg;
    ctx.shadowColor = it.def.color;
    ctx.shadowBlur  = 14;
    ctx.fill();
    ctx.shadowBlur  = 0;
    // shine
    ctx.beginPath();
    ctx.arc(it.x - R*0.28, it.y - R*0.28, R*0.18, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.fill();
    // label
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `${R * 1.05}px serif`;
    ctx.fillText(it.def.label, it.x, it.y + 2);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
}

// ── HUD ───────────────────────────────────────────────────
function drawHUD() {
    // score
    ctx.textAlign = 'left';
    ctx.font      = `bold 22px 'Orbitron', sans-serif`;
    ctx.fillStyle = CUSTOM.theme.gold;
    ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
    ctx.fillText(`${G.score}`, 14, 35);
    // lives
    ctx.textAlign = 'right';
    ctx.font      = '18px serif';
    ctx.fillText(Array.from({length:3},(_,i)=>i<G.lives?'❤️':'🖤').join(''), W-12, 35);
    ctx.shadowBlur = 0;
    // stage label
    ctx.font      = `bold 12px 'Noto Sans JP', sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.textAlign = 'center';
    ctx.fillText(`STAGE ${G.si+1} / ${STAGES.length}`, W/2, 14);
    // progress bar
    const prog = Math.min(G.stagePts / STAGES[G.si].target, 1);
    const bw = W - 80, bx = 40, by = 20;
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    rrect(bx, by, bw, 7, 4); ctx.fill();
    const pg = ctx.createLinearGradient(bx, 0, bx+bw, 0);
    pg.addColorStop(0, CUSTOM.theme.purple);
    pg.addColorStop(1, CUSTOM.theme.pink);
    ctx.fillStyle   = pg;
    ctx.shadowColor = CUSTOM.theme.purple;
    ctx.shadowBlur  = 6;
    rrect(bx, by, Math.max(bw*prog, 8), 7, 4); ctx.fill();
    ctx.shadowBlur  = 0;
    // 吹き出し（下から滑り込み→フェードアウト）
    if (G.stageFlash > 0) {
        const elapsed = STAGE_FLASH_FRAMES - G.stageFlash;
        // Y オフセット：下から上へ滑り込み、最後にフェードアウト
        let slideY = 0;
        if (elapsed < STAGE_FLASH_SLIDE) {
            slideY = (1 - elapsed / STAGE_FLASH_SLIDE) * 120;
        }
        const alpha = G.stageFlash < STAGE_FLASH_SLIDE ? G.stageFlash / STAGE_FLASH_SLIDE : 1;

        const msg    = STAGE_UP_MSG[G.stageFlashMsg] || '';
        const bw     = Math.min(W - 40, 310);
        const bh     = 56;
        const bx     = W / 2;
        const by     = H - 68 + slideY;
        const tailSz = 12;

        ctx.save();
        ctx.globalAlpha = alpha;

        // 吹き出し本体
        ctx.fillStyle   = '#FFFFFF';
        ctx.shadowColor = 'rgba(0,0,0,0.35)';
        ctx.shadowBlur  = 14;
        rrect(bx - bw/2, by - bh/2, bw, bh, bh/2);
        ctx.fill();
        ctx.shadowBlur  = 0;

        // しっぽ（三角）
        ctx.beginPath();
        ctx.moveTo(bx - tailSz,     by + bh/2 - 2);
        ctx.lineTo(bx + tailSz,     by + bh/2 - 2);
        ctx.lineTo(bx,              by + bh/2 + tailSz);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();

        // テキスト
        ctx.font      = `bold 16px 'Noto Sans JP', sans-serif`;
        ctx.fillStyle = '#222';
        ctx.textAlign = 'center';
        ctx.fillText(msg, bx, by + 6);

        ctx.restore();
    }
    // combo
    if (G.combo > 1) {
        const bump = Math.sin(G.frame * 0.14) * 1.5;
        ctx.font      = `bold ${18+bump}px 'Orbitron', sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillStyle = CUSTOM.theme.gold;
        ctx.shadowColor = '#FF6B00'; ctx.shadowBlur = 12;
        ctx.fillText(`🔥 COMBO x${G.combo}`, W/2, H - 16);
        ctx.shadowBlur = 0;
    }
    // ⏸ ポーズボタン（右下）
    ctx.globalAlpha = 0.55;
    ctx.font        = '22px serif';
    ctx.textAlign   = 'right';
    ctx.fillStyle   = '#fff';
    ctx.fillText('⏸', W - 10, H - 10);
    ctx.globalAlpha = 1;
}

// ── Screens ───────────────────────────────────────────────
function drawPaused() {
    drawGame();
    // 暗いオーバーレイ
    ctx.fillStyle = 'rgba(7,1,26,0.72)';
    ctx.fillRect(0, 0, W, H);
    // タイトル
    ctx.textAlign   = 'center';
    ctx.font        = `bold 32px 'Orbitron', sans-serif`;
    ctx.fillStyle   = '#FFFFFF';
    ctx.shadowColor = 'rgba(139,120,255,0.8)'; ctx.shadowBlur = 14;
    ctx.fillText('PAUSE', W/2, H * 0.36);
    ctx.shadowBlur  = 0;
    // 再開ボタン
    pill(W/2, H * 0.50, 190, 52, CUSTOM.theme.teal);
    ctx.font      = `bold 18px 'Orbitron', sans-serif`;
    ctx.fillStyle = '#fff';
    ctx.fillText('再開  ▶', W/2, H * 0.50 + 8);
    // やめるボタン
    pill(W/2, H * 0.63, 190, 52, '#555566');
    ctx.font      = `bold 18px 'Orbitron', sans-serif`;
    ctx.fillStyle = '#ccc';
    ctx.fillText('やめる', W/2, H * 0.63 + 8);
    drawReticle();
}

// ── Loading ───────────────────────────────────────────────
function drawLoading() {
    ctx.fillStyle = '#07011a';
    ctx.fillRect(0, 0, W, H);
    const dots = '.'.repeat((Math.floor(G.frame / 12) % 4));
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.font         = `bold 18px 'Noto Sans JP', sans-serif`;
    ctx.fillStyle    = 'rgba(255,255,255,0.55)';
    ctx.fillText(`${CONFIG.loading.text}${dots}`, W/2, H/2);
    ctx.textBaseline = 'alphabetic';
}

// ── Video fit draw（1:1 動画を中央に、周囲はぼかした動画で埋める）────
function drawVideoFit(video) {
    if (!video || video.readyState < 2) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        return;
    }
    // ぼかした動画を背景として全面に引き伸ばす（端のアーチファクト防止に +60）
    ctx.save();
    ctx.filter = 'blur(24px)';
    ctx.drawImage(video, -30, -30, W + 60, H + 60);
    ctx.filter = 'none';
    ctx.restore();
    // 1:1 で中央に描画
    const size = Math.min(W, H);
    ctx.drawImage(video, (W - size) / 2, (H - size) / 2, size, size);
}

// ── Intro animation ───────────────────────────────────────
// イントロ用バルーン（固定シード）
const INTRO_BALLOONS = Array.from({length:12}, (_, i) => ({
    x:     0.08 + (i % 6) * 0.17,
    delay: i * 9,
    emoji: ['🎈','🎈','🎁','💕','🎈','🕶️'][i % 6],
    size:  28 + (i % 3) * 10,
}));

function drawIntro() {
    const f = G.frame;

    // ── サブフェーズ A: MP4 再生 ────────────────────────────
    if (G.introSub === 'video') {
        drawVideoFit(introVideo);
        return;
    }

    // ── サブフェーズ B: #152038 へのフェードアウト ─────────
    if (G.introSub === 'fade') {
        const t = Math.min(G.introFade / INTRO_FADE_FRAMES, 1);
        drawVideoFit(introVideo);
        ctx.fillStyle = `rgba(21,32,56,${t})`;
        ctx.fillRect(0, 0, W, H);
        return;
    }

    // ── サブフェーズ C: バルーンアニメ（#152038 から開始）──
    const alpha  = f < INTRO_BALLOON_FADEIN
                 ? f / INTRO_BALLOON_FADEIN
                 : f > INTRO_BALLOON_FRAMES - INTRO_BALLOON_FADEOUT
                 ? Math.max(0, (INTRO_BALLOON_FRAMES - f) / INTRO_BALLOON_FADEOUT)
                 : 1;

    // 背景: #152038 固定（動画の終わり色と一致）
    ctx.fillStyle = '#152038';
    ctx.fillRect(0, 0, W, H);

    ctx.globalAlpha = alpha;

    // バルーン群が下から浮かび上がる
    INTRO_BALLOONS.forEach(b => {
        const prog = Math.max(0, Math.min(1, (f - b.delay) / 80));
        if (prog <= 0) return;
        const y   = H + b.size - (H + b.size * 2) * prog;
        const wob = Math.sin((f - b.delay) * 0.06) * 8;
        ctx.font = `${b.size}px serif`;
        ctx.textAlign = 'center';
        ctx.fillText(b.emoji, b.x * W + wob, y);
    });

    // メインテキスト（30f 以降で出現）
    if (f > 30) {
        const ta = Math.min(1, (f - 30) / 30);
        ctx.globalAlpha = alpha * ta;

        if (f > 50) {
            ['✨','⭐','💫'].forEach((s, i) => {
                ctx.font = `20px serif`;
                ctx.fillText(s, W * 0.2 + i * W * 0.3,
                    H * 0.32 + Math.sin(f * 0.07 + i) * 12);
            });
        }

        ctx.textAlign   = 'center';
        ctx.font        = `bold 32px 'Orbitron', sans-serif`;
        ctx.fillStyle   = CUSTOM.theme.gold;
        ctx.shadowColor = CUSTOM.theme.pink; ctx.shadowBlur = 22;
        ctx.fillText(CONFIG.intro.line1, W/2, H * 0.42);
        ctx.font      = `bold 44px 'Orbitron', sans-serif`;
        ctx.fillStyle = CUSTOM.theme.pink;
        ctx.fillText(CONFIG.intro.line2, W/2, H * 0.54);
        ctx.shadowBlur = 0;

        if (fanArtImg && fanArtImg.complete) {
            const ir = 48;
            ctx.save();
            ctx.beginPath();
            ctx.arc(W/2, H * 0.25, ir, 0, Math.PI*2);
            ctx.clip();
            ctx.drawImage(fanArtImg, W/2-ir, H*0.25-ir, ir*2, ir*2);
            ctx.restore();
        } else {
            ctx.font = `56px serif`;
            ctx.fillText(CONFIG.intro.fallbackIcon, W/2, H * 0.28);
        }
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur  = 0;
}


function drawTitleImg() {
    const img = (gameCleared && titleImgCleared?.complete && titleImgCleared.naturalWidth > 0)
        ? titleImgCleared : titleImg;
    if (!img || !img.complete || img.naturalWidth === 0) return;
    const iw = W;
    const ih = iw * img.naturalHeight / img.naturalWidth;
    ctx.drawImage(img, 0, H - ih, iw, ih);
}

function drawTitle() {
    drawBg();
    drawTitleImg();

    const pad = 16;

    // ── タイトルピル ────────────────────────────────────────
    const tH = 48, tY = H * 0.06;
    ctx.fillStyle   = 'rgba(255,255,255,0.90)';
    ctx.shadowColor = 'rgba(0,0,0,0.12)'; ctx.shadowBlur = 8;
    rrect(pad, tY, W - pad*2, tH, tH/2); ctx.fill();
    ctx.shadowBlur  = 0;
    ctx.font        = `bold 22px 'Orbitron', sans-serif`;
    ctx.fillStyle   = '#0a4a8c';
    ctx.textAlign   = 'center';
    ctx.fillText(CONFIG.title.subtitle, W/2, tY + tH/2 + 8);

    // ── 説明カード ──────────────────────────────────────────
    const rules  = CONFIG.title.instructions;
    const lineH  = 26, cPad = 14;
    const cH     = rules.length * lineH + cPad * 2;
    const cY     = tY + tH + 10;
    ctx.fillStyle   = 'rgba(210,235,255,0.80)';
    ctx.shadowColor = 'rgba(0,0,0,0.08)'; ctx.shadowBlur = 6;
    rrect(pad, cY, W - pad*2, cH, 14); ctx.fill();
    ctx.shadowBlur  = 0;
    ctx.font        = `14px 'Noto Sans JP', sans-serif`;
    ctx.fillStyle   = '#0a2a4a';
    ctx.textAlign   = 'left';
    rules.forEach((r, i) => ctx.fillText(r, pad + cPad, cY + cPad + 16 + i * lineH));
    ctx.textAlign   = 'center';

    // ── START ボタン ────────────────────────────────────────
    const by = cY + cH + 28 + 26;
    pill(W/2, by, 190, 52, CUSTOM.theme.pink);
    ctx.font      = `bold 20px 'Orbitron', sans-serif`;
    ctx.fillStyle = '#FFF';
    ctx.fillText(CONFIG.title.startButton, W/2, by + 8);

    // ── イントロ→タイトル フェードイン ──────────────────────
    if (G.titleFade < TITLE_FADE_FRAMES) {
        ctx.fillStyle = `rgba(21,32,56,${1 - G.titleFade / TITLE_FADE_FRAMES})`;
        ctx.fillRect(0, 0, W, H);
    }

    // ── クリア済みのときだけ ↻ リセットボタン（こっそり）────
    if (gameCleared) {
        ctx.globalAlpha = 0.35;
        ctx.font        = `18px serif`;
        ctx.fillStyle   = '#fff';
        ctx.textAlign   = 'right';
        ctx.fillText('↻', W - 10, H - 10);
        ctx.globalAlpha = 1;
    }

    // ボタン Y をグローバルに保持（onInput で参照）
    G._titleBtnY = by;
}

function drawStarting() {
    drawBg();
    drawTitleImg();
    if (G.frame < START_WAIT_FRAMES) return;
    const elapsed = G.frame - START_WAIT_FRAMES;
    const slideF  = START_SLIDE_FRAMES;
    const slideY  = elapsed < slideF ? (1 - elapsed / slideF) * 80 : 0;
    const alpha   = elapsed < slideF ? elapsed / slideF : 1;
    const msg = 'いっくよー！';
    const bw = 220, bh = 58, bx = W / 2, by = H * 0.55 + slideY, tailSz = 12;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle   = '#FFFFFF';
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 14;
    rrect(bx - bw/2, by - bh/2, bw, bh, bh/2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(bx - tailSz, by + bh/2 - 2);
    ctx.lineTo(bx + tailSz, by + bh/2 - 2);
    ctx.lineTo(bx,          by + bh/2 + tailSz);
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    ctx.font      = `bold 22px 'Noto Sans JP', sans-serif`;
    ctx.fillStyle = '#222'; ctx.textAlign = 'center';
    ctx.fillText(msg, bx, by + 8);
    ctx.restore();
}

function drawGame() {
    drawBg();
    G.items.forEach(it => { if (!it.popped) drawBalloon(it); });
    // particles
    G.particles.forEach(p => {
        ctx.globalAlpha = p.life;
        if (p.type === 'text') {
            ctx.font      = `bold 16px 'Noto Sans JP', sans-serif`;
            ctx.fillStyle = p.color;
            ctx.textAlign = 'center';
            ctx.fillText(p.text, p.x, p.y);
        } else {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fillStyle = p.color; ctx.fill();
        }
        ctx.globalAlpha = 1;
    });
    drawHUD();
    drawReticle();
}

function drawOverlay(alpha = 0.8) {
    ctx.fillStyle = `rgba(7,1,26,${alpha})`;
    ctx.fillRect(0, 0, W, H);
}

function drawGameOver() {
    drawGame(); drawOverlay();
    ctx.textAlign = 'center';
    ctx.font      = `bold 38px 'Orbitron', sans-serif`;
    ctx.fillStyle = '#FF4444';
    ctx.shadowColor = '#FF0000'; ctx.shadowBlur = 20;
    ctx.fillText(CONFIG.gameOver.title, W/2, H*0.35);
    ctx.shadowBlur = 0;
    ctx.font      = `bold 24px 'Orbitron', sans-serif`;
    ctx.fillStyle = CUSTOM.theme.gold;
    ctx.fillText(`SCORE:  ${G.score}`, W/2, H*0.46);
    ctx.font      = `15px 'Noto Sans JP', sans-serif`;
    ctx.fillStyle = '#C4AAEE';
    ctx.fillText(CONFIG.gameOver.message, W/2, H*0.55);
    const by = H * 0.68;
    pill(W/2, by, 190, 52, CUSTOM.theme.pink);
    ctx.font      = `bold 18px 'Orbitron', sans-serif`;
    ctx.fillStyle = '#FFF';
    ctx.fillText(CONFIG.gameOver.retryButton, W/2, by + 8);
}

function drawEnding() {
    drawBg();
    // confetti
    G.confetti.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y); ctx.rotate(c.rot);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
        ctx.restore();
    });

    // ぴょこぴょこキャラ（背景レイヤー、半透明）
    G.bouncers.forEach((b, bi) => {
        const img = bouncerImgs[bi]?.complete ? bouncerImgs[bi]
                  : fanArtImg?.complete       ? fanArtImg
                  : null;
        ctx.save();
        ctx.globalAlpha = 0.82;
        if (img) {
            const r = b.size / 2;
            ctx.beginPath();
            ctx.arc(b.x, b.y, r, 0, Math.PI*2);
            ctx.clip();
            ctx.drawImage(img, b.x - r, b.y - r, b.size, b.size);
        } else {
            ctx.font = `${b.size}px serif`;
            ctx.textAlign    = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(CONFIG.ending.fallbackIcon, b.x, b.y);
            ctx.textBaseline = 'alphabetic';
        }
        ctx.restore();
    });
    // periodic firework bursts
    G.particles.forEach(p => {
        ctx.globalAlpha = p.life;
        if (p.type !== 'text') {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fillStyle = p.color; ctx.fill();
        }
        ctx.globalAlpha = 1;
    });
    // main message
    const t = G.frame * 0.035;
    ctx.textAlign = 'center';
    // icon / fan art
    if (fanArtImg && fanArtImg.complete) {
        const iw = 120, ih = 120;
        ctx.save();
        ctx.beginPath();
        ctx.arc(W/2, H*0.20, iw/2, 0, Math.PI*2);
        ctx.clip();
        ctx.drawImage(fanArtImg, W/2-iw/2, H*0.20-ih/2, iw, ih);
        ctx.restore();
    } else {
        ctx.font = `${62 + Math.sin(t)*6}px serif`;
        ctx.fillText(CONFIG.ending.fallbackIcon, W/2, H*0.22);
    }
    ctx.font      = `bold 26px 'Orbitron', sans-serif`;
    ctx.fillStyle = CUSTOM.theme.gold;
    ctx.shadowColor = CUSTOM.theme.pink; ctx.shadowBlur = 20;
    ctx.fillText(CONFIG.ending.subtitle, W/2, H*0.38);
    ctx.shadowBlur = 0;
    ctx.font      = `bold 22px 'Orbitron', sans-serif`;
    ctx.fillStyle = CUSTOM.theme.pink;
    ctx.fillText(CONFIG.ending.message, W/2, H*0.44);
    ctx.font      = `bold 20px 'Orbitron', sans-serif`;
    ctx.fillStyle = '#E0C9FF';
    ctx.fillText(`${CONFIG.ending.scorePrefix}${G.score}`, W/2, H*0.62);
    // もう一度あそぶボタン
    const by = H * 0.76;
    pill(W/2, by, 220, 52, CUSTOM.theme.pink);
    ctx.font      = `bold 18px 'Orbitron', sans-serif`;
    ctx.fillStyle = '#FFF';
    ctx.fillText(CONFIG.ending.replayButton, W/2, by + 8);
}

// ── Update ────────────────────────────────────────────────
function update() {
    if (G.phase === 'paused') return;
    G.frame++;

    // ローディング → イントロへ
    if (G.phase === 'loading') {
        if (G.frame >= LOADING_FRAMES) {
            G.phase    = 'intro';
            G.introSub = introVideo ? 'video' : 'balloons';
            G.frame    = 0;
            G.introFade = 0;
            // 動画を再生開始
            if (introVideo) introVideo.play().catch(() => {});
        }
        return;
    }
    // イントロ各サブフェーズ
    if (G.phase === 'intro') {
        if (G.introSub === 'video') {
            // 動画終了を検知したら フェードへ
            if (introVideoEnded) {
                G.introSub  = 'fade';
                G.introFade = 0;
            }
        } else if (G.introSub === 'fade') {
            G.introFade++;
            if (G.introFade >= INTRO_FADE_FRAMES) {
                G.introSub = 'balloons';
                G.frame    = 0;
            }
        } else if (G.introSub === 'balloons') {
            if (G.frame >= INTRO_BALLOON_FRAMES) { G.phase = 'title'; G.frame = 0; G.titleFade = 0; }
        }
        return;
    }
    if (G.phase === 'title') {
        if (G.titleFade < TITLE_FADE_FRAMES) G.titleFade++;
    }
    if (G.phase === 'starting') {
        if (G.frame >= START_TOTAL_FRAMES) { G.phase = 'playing'; G.frame = 0; gaEvent('game_start'); }
    }
    if (G.phase === 'playing') {
        const stage = STAGES[G.si];
        if (G.frame % stage.interval === 0) {
            spawnItem();
            if (G.si >= 1 && G.frame % (stage.interval * 2) === 0) spawnItem();
        }
        G.items = G.items.filter(it => {
            if (it.popped) return false;
            it.y      += it.vy;
            it.x      += it.vx;
            it.wobble += 0.025;
            it.x      += Math.sin(it.wobble) * 0.35;
            return it.y > -R * 3;
        });
        if (G.combo > 1 && Date.now() - G.lastPop > COMBO_MS) G.combo = 1;
        if (G.bgT < 1) G.bgT = Math.min(G.bgT + 0.018, 1);
        if (G.stageFlash > 0) G.stageFlash--;
        if (G.slowTimer  > 0) G.slowTimer--;
    }
    if (G.phase === 'ending') {
        G.confetti.forEach(c => {
            c.x += c.vx; c.y += c.vy; c.rot += c.rotV;
            if (c.y > H + 20) { c.y = -10; c.x = Math.random() * W; }
        });
        if (G.frame % 75 === 0) {
            const cols = [CUSTOM.theme.pink, CUSTOM.theme.gold, CUSTOM.theme.purple];
            burst(Math.random()*W, Math.random()*H*0.6, cols[G.frame%3], 18);
        }
        // ぴょこぴょこキャラ
        G.bouncers.forEach((b, bi) => {
            if (b.x === 0) { b.x = W * (0.3 + bi * 0.4); b.y = H * 0.3; }
            b.x += b.vx; b.y += b.vy;
            b.vy += 0.10;
            const r = b.size / 2;
            if (b.x - r < 0)  { b.x = r;   b.vx =  Math.abs(b.vx) * 0.92; }
            if (b.x + r > W)  { b.x = W-r; b.vx = -Math.abs(b.vx) * 0.92; }
            if (b.y - r < 0)  { b.y = r;   b.vy =  Math.abs(b.vy) * 0.85; }
            if (b.y + r > H)  { b.y = H-r; b.vy = -Math.abs(b.vy) * 0.88;
                                 b.vx += (Math.random()-0.5) * 1.5; }
        });
    }
    G.particles = G.particles.filter(p => {
        p.life -= p.type === 'text' ? 0.014 : 0.028;
        p.x += p.vx; p.y += p.vy;
        if (p.type !== 'text') { p.vy += 0.12; p.vx *= 0.97; }
        return p.life > 0;
    });
}

// ── Render ────────────────────────────────────────────────
function render() {
    ctx.clearRect(0, 0, W, H);
    // ゲーム操作中だけシステムカーソルを非表示にしてレティクルに置き換える
    canvas.style.cursor = (G.phase === 'playing' || G.phase === 'paused') ? 'none' : '';
    switch(G.phase) {
        case 'loading':  drawLoading(); break;
        case 'intro':    drawIntro();   break;
        case 'title':    drawTitle();    break;
        case 'starting': drawStarting(); break;
        case 'playing':  drawGame();     break;
        case 'paused':   drawPaused();   break;
        case 'gameOver': drawGameOver(); break;
        case 'ending':   drawEnding();   break;
    }
}

function loop() { update(); render(); requestAnimationFrame(loop); }

// ── Input ─────────────────────────────────────────────────
function getXY(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = W / rect.width, sy = H / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return { x:(src.clientX - rect.left)*sx, y:(src.clientY - rect.top)*sy };
}
function hit(x, y, cx, cy, w, h) {
    return Math.abs(x-cx) < w/2 && Math.abs(y-cy) < h/2;
}

function onInput(e) {
    e.preventDefault();
    const {x, y} = getXY(e);
    switch(G.phase) {
        case 'title':
            if (hit(x, y, W/2, G._titleBtnY ?? H*0.52, 190, 52)) {
                G.phase = 'starting';
                G.frame = 0;
            } else if (gameCleared && hit(x, y, W - 20, H - 16, 36, 36)) {
                resetCleared();
            }
            break;
        case 'playing':
            if (hit(x, y, W - 20, H - 16, 44, 44)) {
                G.phase = 'paused';
            } else {
                tryPop(x, y);
            }
            break;
        case 'paused':
            if (hit(x, y, W/2, H * 0.50, 190, 52)) {
                G.phase = 'playing';
            } else if (hit(x, y, W/2, H * 0.63, 190, 52)) {
                replayState();
            }
            break;
        case 'gameOver':
            if (hit(x, y, W/2, H*0.68, 190, 52)) replayState();
            break;
        case 'ending':
            if (hit(x, y, W/2, H*0.76, 220, 52)) replayState();
            break;
    }
}

canvas.addEventListener('click',      onInput);
canvas.addEventListener('touchstart', onInput, { passive:false });

// ── レティクル追従 ─────────────────────────────────────────
let cursorX = -999, cursorY = -999;
function updateCursor(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = W / rect.width, sy = H / rect.height;
    const src = e.touches ? e.touches[0] : e;
    if (src) { cursorX = (src.clientX - rect.left) * sx; cursorY = (src.clientY - rect.top) * sy; }
}
canvas.addEventListener('mousemove',  updateCursor);
canvas.addEventListener('touchmove',  updateCursor, { passive: true });
canvas.addEventListener('mouseleave', () => { cursorX = -999; cursorY = -999; });

function drawReticle() {
    if (!reticleImg || !reticleImg.complete || reticleImg.naturalWidth === 0) return;
    if (cursorX < 0) return;
    const s = RETICLE_SIZE;
    ctx.drawImage(reticleImg, cursorX - s / 2, cursorY - s / 2, s, s);
}

function replayState() {
    initState();
    G.phase = 'title';
    G.frame = 0;
}
initState();
loop();
</script>
