<script>
// ==========================================================
//  SKY BURST · 42 — Redesigned
//  Dark-neon UI shell. Game logic preserved; visuals reskinned.
// ==========================================================

const STAGES       = CONFIG.stages;
const STAGE_UP_MSG = CONFIG.stageUpMessages;

// ── Design tokens (UI shell — game items keep their original colors) ─────
const UI = {
    bg0:      '#050714',
    bg1:      '#0a0e1f',
    accent:   '#6df0ff',
    accent2:  '#ff7a8a',   // warn / target lock
    ink0:     '#f4f6ff',
    ink1:     '#c8cce8',
    ink2:     '#7a80a8',
    ink3:     '#3f4570',
    line:     'rgba(255,255,255,0.10)',
    line2:    'rgba(255,255,255,0.18)',
    fontDisp: '"Space Grotesk", system-ui, sans-serif',
    fontMono: '"JetBrains Mono", ui-monospace, monospace',
    fontJa:   '"Noto Sans JP", system-ui, sans-serif',
};

// Item defs from CONFIG
const DEFS = {};
Object.entries(CONFIG.items).forEach(([k, d]) => {
    DEFS[k] = {
        label: d.label, pts: d.pts, w: d.w, color: d.color, bg: d.bg,
        hazard: d.hazard ?? false, special: d.special ?? false, slow: d.slow ?? false,
    };
});

const R        = 36;
const COMBO_MS = 1500;

// timing
const LOADING_FRAMES        = 100;
const INTRO_FADE_FRAMES     = 30;
const TITLE_FADE_FRAMES     = 40;
const STAGE_FLASH_FRAMES    = 160;
const STAGE_FLASH_SLIDE     = 22;
const START_WAIT_FRAMES     = 60;
const START_SLIDE_FRAMES    = 15;
const START_TOTAL_FRAMES    = 210;
const SLOW_FRAMES           = 120;
const RETICLE_SIZE          = 80;

// ── Canvas setup ──────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;
function resize() {
    const aspect = 9 / 16;
    H = Math.min(window.innerHeight, 1100);
    W = Math.min(window.innerWidth, H * aspect, 560);
    H = Math.min(H, W / aspect);
    canvas.width  = Math.floor(W);
    canvas.height = Math.floor(H);
    W = canvas.width;
    H = canvas.height;
}
resize();
window.addEventListener('resize', resize);

// ── Asset loading ─────────────────────────────────────────
function loadImg(src) { const img = new Image(); img.src = src; return img; }
const bouncerSrcs = CONFIG.assets.bouncerSrc
    ? (Array.isArray(CONFIG.assets.bouncerSrc) ? CONFIG.assets.bouncerSrc : [CONFIG.assets.bouncerSrc]) : [];
const bouncerImgs = bouncerSrcs.map(s => loadImg(s));
let titleImg        = CONFIG.assets.titleImgSrc        ? loadImg(CONFIG.assets.titleImgSrc)        : null;
let titleImgCleared = CONFIG.assets.titleImgClearedSrc ? loadImg(CONFIG.assets.titleImgClearedSrc) : null;
let reticleImg      = CONFIG.assets.reticleSrc         ? loadImg(CONFIG.assets.reticleSrc)         : null;
const howtoImg      = loadImg('./assets/howto-img.png');
const chickenImg    = CONFIG.assets.chickenImgSrc ? loadImg(CONFIG.assets.chickenImgSrc) : null;
const itemImgs = {};
Object.entries(CONFIG.items).forEach(([k, d]) => {
    if (d.img) itemImgs[k] = loadImg(`./assets/items/${d.img}`);
});

const CLEARED_KEY = 'sky-burst-42-cleared';
let gameCleared = sessionStorage.getItem(CLEARED_KEY) === '1';
function setCleared() { gameCleared = true;  sessionStorage.setItem(CLEARED_KEY, '1'); }
function resetCleared() { gameCleared = false; sessionStorage.removeItem(CLEARED_KEY); }
let titleImgAlt = false;

let introVideo = null;
let introVideoEnded = false;
let introVideoReady = false;
if (CONFIG.assets.introVideoSrc) {
    introVideo = document.createElement('video');
    introVideo.src = CONFIG.assets.introVideoSrc;
    introVideo.muted = true;
    introVideo.playsInline = true;
    introVideo.preload = 'auto';
    introVideo.style.cssText = 'position:fixed;opacity:0;pointer-events:none;width:1px;height:1px';
    document.body.appendChild(introVideo);
    introVideo.addEventListener('ended', () => { introVideoEnded = true; });
    introVideo.addEventListener('canplay', () => { introVideoReady = true; });
    introVideo.addEventListener('canplaythrough', () => { introVideoReady = true; });
    introVideo.addEventListener('error', () => { introVideoEnded = true; introVideoReady = true; });
} else {
    introVideoReady = true;
}

// reticle tint cache
let _retCache = null;
function tintedReticle(color) {
    if (!reticleImg || !reticleImg.complete || reticleImg.naturalWidth === 0) return null;
    if (_retCache && _retCache.color === color) return _retCache.canvas;
    const off = document.createElement('canvas');
    off.width = reticleImg.naturalWidth; off.height = reticleImg.naturalHeight;
    const o = off.getContext('2d');
    o.drawImage(reticleImg, 0, 0);
    o.globalCompositeOperation = 'source-in';
    o.fillStyle = color;
    o.fillRect(0, 0, off.width, off.height);
    _retCache = { color, canvas: off };
    return off;
}

// ── State ─────────────────────────────────────────────────
let G;
function initState() {
    G = {
        phase: 'loading', frame: 0,
        introSub: 'video', introFade: 0,
        score: 0, combo: 1, lives: 3,
        si: 0, stagePts: 0,
        items: [], particles: [], confetti: [],
        lastPop: 0,
        pool: buildPool(0),
        stars: buildStars(),
        bgT: 1,
        bgFrom: { bg1: STAGES[0].bg1, bg2: STAGES[0].bg2 },
        stageFlash: 0, stageFlashMsg: 0,
        titleFade: 0,
        missed: 0,
        slowTimer: 0,
        endingInputDelay: 0,
        endingChickenPopup: false,
        goChickenPopup: false,
        bouncers: [
            { x: 0, y: 0, vx:  1.5, vy: -1.8, size: 86 },
            { x: 0, y: 0, vx: -1.2, vy: -1.6, size: 86 },
        ],
    };
}
function buildStars() {
    return Array.from({length: 56}, () => ({
        x: Math.random(), y: Math.random() * 0.85,
        r: 0.4 + Math.random() * 1.4,
        ph: Math.random() * Math.PI * 2,
    }));
}
function buildPool(si) {
    const bw = STAGES[si].bombW;
    const pool = [];
    Object.entries(DEFS).forEach(([k, d]) => {
        const wt = d.hazard ? bw : d.slow && STAGES[si].clockW != null ? STAGES[si].clockW : d.w;
        for (let i = 0; i < wt; i++) pool.push(k);
    });
    return pool;
}

// ── Spawn ─────────────────────────────────────────────────
function spawnItem() {
    const type = G.pool[Math.floor(Math.random() * G.pool.length)];
    const def  = DEFS[type];
    const sf   = G.slowTimer > 0 ? 0.55 : 1;
    const spd  = (STAGES[G.si].speed + Math.random() * 0.8) * sf;
    G.items.push({
        type, def,
        x: R + Math.random() * (W - R*2),
        y: H + R + 12,
        vy: -spd,
        vx: (Math.random() - 0.5) * 0.4,
        wobble: Math.random() * Math.PI * 2,
        popped: false,
    });
}

// ── Particles ─────────────────────────────────────────────
function burst(x, y, color, n=12) {
    for (let i=0; i<n; i++) {
        const a = (Math.PI*2/n)*i + Math.random()*0.5;
        const s = 2 + Math.random()*5;
        G.particles.push({ type:'dot', x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, r:3+Math.random()*4, color, life:1 });
    }
}
function floatText(x, y, text, color) {
    G.particles.push({ type:'text', x, y, vy:-1.6, vx:0, text, color, life:1 });
}
function spawnConfetti() {
    const cols = ['#6df0ff', '#ff7a8a', '#FFD700', '#A78BFA', '#6EE7B7', '#ffffff'];
    G.confetti = Array.from({length: 200}, () => ({
        x: Math.random()*W, y: -20 - Math.random()*H,
        vy: 1.2 + Math.random()*2, vx: (Math.random()-0.5)*1.5,
        color: cols[Math.floor(Math.random()*cols.length)],
        w: 6 + Math.random()*8, h: 3 + Math.random()*5,
        rot: Math.random()*Math.PI, rotV: (Math.random()-0.5)*0.18,
    }));
}

// ── Pop ───────────────────────────────────────────────────
function tryPop(px, py) {
    if (G.phase !== 'playing') return;
    for (let i=G.items.length-1; i>=0; i--) {
        const it = G.items[i];
        if (it.popped) continue;
        const dx = px - it.x, dy = py - it.y;
        if (dx*dx + dy*dy < R*R*1.8) { it.popped = true; onPop(it); return; }
    }
}
function onPop(it) {
    const now = Date.now();
    if (it.def.hazard) {
        G.combo = 1;
        G.lives = Math.max(0, G.lives - 1);
        burst(it.x, it.y, UI.accent2, 10);
        floatText(it.x, it.y - 20, 'MISS −1', UI.accent2);
        if (G.lives <= 0) setTimeout(() => G.phase = 'gameOver', 400);
    } else {
        G.combo   = (now - G.lastPop < COMBO_MS) ? Math.min(G.combo + 1, 8) : 1;
        G.lastPop = now;
        const pts = it.def.pts * G.combo;
        G.score    += pts;
        G.stagePts += pts;
        burst(it.x, it.y, it.def.color, it.def.special ? 22 : 12);
        if (it.def.slow) {
            if (G.slowTimer === 0) G.items.forEach(t => { if (!t.popped) t.vy *= 0.55; });
            G.slowTimer = SLOW_FRAMES;
            floatText(it.x, it.y - 24, `+${pts}  SLOW`, '#6EE7B7');
        } else {
            floatText(it.x, it.y - 24,
                G.combo > 1 ? `+${pts}  ×${G.combo}` : `+${pts}`,
                G.combo > 2 ? UI.accent : '#FFF');
        }
        if (G.stagePts >= STAGES[G.si].target) {
            if (G.si >= STAGES.length - 1) {
                setCleared();
                setTimeout(() => { spawnConfetti(); G.phase = 'ending'; G.endingInputDelay = 90; }, 350);
            } else {
                G.bgFrom = { bg1: STAGES[G.si].bg1, bg2: STAGES[G.si].bg2 };
                G.bgT = 0; G.si++;
                G.stagePts = 0;
                G.pool = buildPool(G.si);
                G.stageFlash = STAGE_FLASH_FRAMES;
                G.stageFlashMsg = G.si - 1;
            }
        }
    }
}

// ── Helpers ───────────────────────────────────────────────
function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
}
function lerpHex(a, b, t) {
    const p = s => [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)];
    const [ar,ag,ab] = p(a), [br,bg,bb] = p(b);
    const r = Math.round(ar+(br-ar)*t), g = Math.round(ag+(bg-ag)*t), bv = Math.round(ab+(bb-ab)*t);
    return '#' + [r,g,bv].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function hexA(hex, a) {
    if (!hex.startsWith('#')) return hex;
    let h = hex.replace('#','');
    if (h.length === 3) h = h.split('').map(c=>c+c).join('');
    const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
}

// hairline rule with pad
function hairline(x1, y1, x2, y2, color = UI.line) {
    ctx.strokeStyle = color; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

// ── Background ────────────────────────────────────────────
function drawBg() {
    const t   = G.bgT ?? 1;
    const cur = STAGES[G.si] ?? STAGES[STAGES.length-1];
    const c1  = G.bgFrom ? lerpHex(G.bgFrom.bg1, cur.bg1, t) : cur.bg1;
    const c2  = G.bgFrom ? lerpHex(G.bgFrom.bg2, cur.bg2, t) : cur.bg2;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, c1);
    grad.addColorStop(1, c2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // accent glow at the bottom (where balloons spawn)
    const gh = ctx.createRadialGradient(W/2, H, 0, W/2, H, H*0.6);
    gh.addColorStop(0, hexA(UI.accent, 0.10));
    gh.addColorStop(1, hexA(UI.accent, 0));
    ctx.fillStyle = gh;
    ctx.fillRect(0, H*0.5, W, H*0.5);

    // grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    const gx = Math.max(60, W / 9);
    const gy = Math.max(80, H / 14);
    for (let x = gx; x < W; x += gx) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = gy; y < H; y += gy) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // stars
    const starAlphaBase = 0.10 + 0.55 * (G.si / (STAGES.length - 1));
    G.stars.forEach(s => {
        const a = Math.sin(G.frame * 0.04 + s.ph) * 0.35 + 0.55;
        ctx.globalAlpha = a * starAlphaBase;
        ctx.beginPath();
        ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
        ctx.fillStyle = '#FFF';
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

// ── Items ─────────────────────────────────────────────────
function puffyStarPath(cx, cy, outerR, innerR, n) {
    ctx.beginPath();
    for (let i=0; i<n; i++) {
        const outerA = (i*2*Math.PI/n) - Math.PI/2;
        const innerA1 = outerA - Math.PI/n, innerA2 = outerA + Math.PI/n;
        const ix1 = cx + Math.cos(innerA1)*innerR, iy1 = cy + Math.sin(innerA1)*innerR;
        const ox  = cx + Math.cos(outerA)*outerR,  oy  = cy + Math.sin(outerA)*outerR;
        const ix2 = cx + Math.cos(innerA2)*innerR, iy2 = cy + Math.sin(innerA2)*innerR;
        if (i === 0) ctx.moveTo(ix1, iy1); else ctx.lineTo(ix1, iy1);
        ctx.quadraticCurveTo(ox, oy, ix2, iy2);
    }
    ctx.closePath();
}
function drawBalloon(it) {
    ctx.save();

    // string for non-hazard, non-slow items
    if (!it.def.hazard && !it.def.slow) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.lineWidth = 1.5;
        ctx.moveTo(it.x, it.y + R);
        ctx.lineTo(it.x, it.y + R + 32);
        ctx.stroke();
    }

    const img = itemImgs[it.type];
    const imgReady = img && img.complete && img.naturalWidth > 0;

    if (imgReady) {
        ctx.shadowColor = it.def.color;
        ctx.shadowBlur = it.def.special ? 22 : it.def.slow ? 18 : 14;
        ctx.drawImage(img, it.x - R, it.y - R, R * 2, R * 2);
        ctx.shadowBlur = 0;
    } else {
        // fallback: emoji rendering
        if (it.def.slow) {
            const bg = ctx.createRadialGradient(it.x - R*0.28, it.y - R*0.28, 2, it.x, it.y, R);
            bg.addColorStop(0, it.def.color + 'EE');
            bg.addColorStop(1, it.def.bg    + 'CC');
            ctx.fillStyle = bg;
            ctx.shadowColor = it.def.color; ctx.shadowBlur = 16;
            puffyStarPath(it.x, it.y, R, R*0.52, 5);
            ctx.fill(); ctx.shadowBlur = 0;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = `${R*0.95}px serif`;
            ctx.fillText(it.def.label, it.x, it.y + 2);
            ctx.textBaseline = 'alphabetic';
        } else {
            const bg = ctx.createRadialGradient(it.x - R*0.28, it.y - R*0.28, 2, it.x, it.y, R);
            bg.addColorStop(0, it.def.color + 'EE');
            bg.addColorStop(1, it.def.bg    + 'CC');
            ctx.beginPath();
            ctx.arc(it.x, it.y, R, 0, Math.PI*2);
            ctx.fillStyle = bg;
            ctx.shadowColor = it.def.color; ctx.shadowBlur = 14;
            ctx.fill(); ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(it.x - R*0.28, it.y - R*0.28, R*0.18, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(255,255,255,0.38)'; ctx.fill();
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.font = `${R*1.05}px serif`;
            ctx.fillText(it.def.label, it.x, it.y + 2);
            ctx.textBaseline = 'alphabetic';
        }
    }

    ctx.restore();
}

// ── Callout bubble (shared by Starting + Stage-flash) ────
function drawCallout(cx, cy, bw, bh, label, msg, msgSize) {
    const bbx = cx - bw/2, bby = cy - bh/2;
    // box
    ctx.fillStyle = UI.bg1;
    ctx.fillRect(bbx, bby, bw, bh);
    ctx.strokeStyle = UI.accent; ctx.lineWidth = 1;
    ctx.strokeRect(bbx + 0.5, bby + 0.5, bw - 1, bh - 1);
    // label
    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.accent;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText(label, bbx + 12, bby + 10);
    // message
    ctx.font = `500 ${msgSize}px ${UI.fontJa}`;
    ctx.fillStyle = UI.ink0;
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(msg, bbx + 12, bby + bh - 14);
    // line tail: vertical then diagonal, dot at end
    const tx = bbx + 16, ty = bby + bh;
    ctx.strokeStyle = UI.accent; ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx, ty + 10);
    ctx.lineTo(tx + 14, ty + 24);
    ctx.stroke();
    ctx.fillStyle = UI.accent;
    ctx.beginPath();
    ctx.arc(tx + 14, ty + 24, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineCap = 'butt';
}

// ── HUD ───────────────────────────────────────────────────
const PAUSE_BTN = { size: 40 };

function drawHUD() {
    const padX = 16;

    // Proportional Y positions
    const hMid  = Math.round(H * 0.024);  // top-bar center (≈22)
    const hLine = Math.round(H * 0.062);  // top hairline   (≈56)
    const hPrg  = Math.round(H * 0.089);  // progress bar   (≈80)
    const hScr  = Math.round(H * 0.107);  // score baseline (≈96)
    const hLbl  = Math.round(H * 0.122);  // SCORE label    (≈110)
    const hSlow = Math.round(H * 0.147);  // slow indicator (≈132)

    // top hairline
    hairline(padX, hLine, W - padX, hLine, UI.line);

    // dot + STAGE label (left)
    ctx.fillStyle = UI.accent;
    ctx.beginPath(); ctx.arc(padX + 4, hMid, 4, 0, Math.PI*2); ctx.fill();
    ctx.save();
    ctx.shadowColor = UI.accent; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(padX + 4, hMid, 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(`STAGE ${G.si+1} / ${STAGES.length}`, padX + 16, hMid);

    // lives (right) — ticks first, then LIFE label to the left of them
    const livesX = W - padX;
    const tickW = 8, tickGap = 4;
    const tickStart = livesX - (3 * tickW + 2 * tickGap);
    for (let i = 0; i < 3; i++) {
        const cx = tickStart + i * (tickW + tickGap);
        if (i < G.lives) {
            ctx.fillStyle = UI.accent;
            ctx.fillRect(cx, hMid - 4, tickW, 8);
        } else {
            ctx.strokeStyle = UI.ink3; ctx.lineWidth = 1;
            ctx.strokeRect(cx + 0.5, hMid - 3.5, tickW - 1, 7);
        }
    }
    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('LIFE', tickStart - 8, hMid);

    // score - large, left
    ctx.font = `600 32px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(`${G.score}`.padStart(4, '0'), padX, hScr);

    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.fillText('SCORE', padX, hLbl);

    // progress bar (right block)
    const bx = padX + 110, by = hPrg, bw = W - padX*2 - 110, bh = 4;
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(bx, by, bw, bh);
    const prog = Math.min(G.stagePts / STAGES[G.si].target, 1);
    ctx.fillStyle = UI.accent;
    ctx.fillRect(bx, by, Math.max(bw*prog, 2), bh);

    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'left';
    ctx.fillText('TARGET', bx, by - 6);
    ctx.textAlign = 'right';
    ctx.fillText(`${Math.floor(prog*100)}%`, bx + bw, by - 6);

    // stage flash callout (rect, hard edges)
    if (G.stageFlash > 0) {
        const elapsed = STAGE_FLASH_FRAMES - G.stageFlash;
        let slideY = 0;
        if (elapsed < STAGE_FLASH_SLIDE) slideY = (1 - elapsed / STAGE_FLASH_SLIDE) * 60;
        const alpha = G.stageFlash < STAGE_FLASH_SLIDE ? G.stageFlash / STAGE_FLASH_SLIDE : 1;
        const msg = STAGE_UP_MSG[G.stageFlashMsg] || '';
        const bw2 = Math.min(W - 32, 320), bh2 = 72;
        const cx = W/2, cy = H - 110 + slideY;
        ctx.save();
        ctx.globalAlpha = alpha;

        drawCallout(cx, cy, bw2, bh2, `STAGE ${G.si+1}  //  SPEED UP`, msg, 16);
        ctx.restore();
    }

    // combo bar (bottom)
    if (G.combo > 1) {
        const cy = H - 32;
        const cw = Math.min(W - 32, 240);
        const cx = W/2 - cw/2;
        ctx.font = `500 10px ${UI.fontMono}`;
        ctx.fillStyle = UI.accent;
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
        ctx.fillText('COMBO', cx, cy - 8);
        ctx.font = `600 14px ${UI.fontDisp}`;
        ctx.textAlign = 'right';
        ctx.fillStyle = UI.ink0;
        ctx.fillText(`×${G.combo}`, cx + cw, cy - 8);
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(cx, cy, cw, 2);
        ctx.fillStyle = UI.accent;
        ctx.fillRect(cx, cy, cw * (G.combo / 8), 2);
    }

    // slow indicator
    if (G.slowTimer > 0) {
        ctx.font = `500 10px ${UI.fontMono}`;
        ctx.fillStyle = '#6EE7B7';
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText(`SLOW  ${(G.slowTimer/60).toFixed(1)}s`, W - padX, hSlow);
    }

    // pause btn (top-right corner) — drawn as a small 2-bar icon inside a square
    const pbX = W - padX - PAUSE_BTN.size, pbY = H - padX - PAUSE_BTN.size;
    ctx.strokeStyle = UI.line2; ctx.lineWidth = 1;
    ctx.strokeRect(pbX + 0.5, pbY + 0.5, PAUSE_BTN.size - 1, PAUSE_BTN.size - 1);
    ctx.fillStyle = UI.ink1;
    ctx.fillRect(pbX + 14, pbY + 12, 3, 16);
    ctx.fillRect(pbX + 22, pbY + 12, 3, 16);
    G._pauseBtn = { x: pbX + PAUSE_BTN.size/2, y: pbY + PAUSE_BTN.size/2, w: PAUSE_BTN.size, h: PAUSE_BTN.size };
}

// ── Reticle ───────────────────────────────────────────────
let cursorX = -999, cursorY = -999;
function drawReticle(targetLock = false) {
    const tint = tintedReticle(targetLock ? UI.accent2 : UI.accent);
    if (!tint || cursorX < 0) return;
    const s = RETICLE_SIZE;
    ctx.save();
    ctx.globalAlpha = 0.95;
    ctx.shadowColor = targetLock ? UI.accent2 : UI.accent;
    ctx.shadowBlur = 18;
    ctx.drawImage(tint, cursorX - s/2, cursorY - s/2, s, s);
    ctx.restore();
    ctx.fillStyle = targetLock ? UI.accent2 : UI.accent;
    ctx.beginPath(); ctx.arc(cursorX, cursorY, 2, 0, Math.PI*2); ctx.fill();
}

// ── Loading ───────────────────────────────────────────────
function drawLoading() {
    ctx.fillStyle = UI.bg0;
    ctx.fillRect(0, 0, W, H);
    // brand — auto-sizing to fit any title length
    const maxBrandW = W * 0.7, gap = 10;
    let brandSz = 28;
    ctx.font = `600 ${brandSz}px ${UI.fontDisp}`;
    let w1 = ctx.measureText(CONFIG.loading.title1).width;
    ctx.font = `500 italic ${brandSz}px ${UI.fontDisp}`;
    let w2 = ctx.measureText(CONFIG.loading.title2).width;
    while (w1 + w2 + gap > maxBrandW && brandSz > 14) {
        brandSz--;
        ctx.font = `600 ${brandSz}px ${UI.fontDisp}`;
        w1 = ctx.measureText(CONFIG.loading.title1).width;
        ctx.font = `500 italic ${brandSz}px ${UI.fontDisp}`;
        w2 = ctx.measureText(CONFIG.loading.title2).width;
    }
    const startX = (W - (w1 + w2 + gap)) / 2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = `600 ${brandSz}px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.fillText(CONFIG.loading.title1, startX, H * 0.45);
    ctx.font = `500 italic ${brandSz}px ${UI.fontDisp}`;
    ctx.fillStyle = UI.accent;
    ctx.fillText(CONFIG.loading.title2, startX + w1 + gap, H * 0.45);
    // progress bar
    const bx = W*0.2, by = H*0.55, bw = W*0.6;
    ctx.strokeStyle = UI.line; ctx.strokeRect(bx + 0.5, by + 0.5, bw, 2);
    ctx.fillStyle = UI.accent;
    const p = Math.min(G.frame / LOADING_FRAMES, 1);
    ctx.fillRect(bx, by, bw * p, 3);
    // text
    const dots = '.'.repeat((Math.floor(G.frame/12) % 4));
    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'left';
    ctx.fillText(`${CONFIG.loading.text}${dots}`, bx, H*0.62);
}

// ── Video fit ─────────────────────────────────────────────
function drawVideoFit(video) {
    if (!video || video.readyState < 2) {
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); return;
    }
    ctx.save();
    ctx.filter = 'blur(24px)';
    ctx.drawImage(video, -30, -30, W + 60, H + 60);
    ctx.filter = 'none';
    ctx.restore();
    const size = Math.min(W, H);
    ctx.drawImage(video, (W - size) / 2, (H - size) / 2, size, size);
}

// ── Intro ─────────────────────────────────────────────────
function drawIntro() {
    if (G.introSub === 'video') { drawVideoFit(introVideo); return; }
    if (G.introSub === 'fade') {
        const t = Math.min(G.introFade / INTRO_FADE_FRAMES, 1);
        drawVideoFit(introVideo);
        ctx.fillStyle = `rgba(5,7,20,${t})`;
        ctx.fillRect(0, 0, W, H);
    }
}

// ── Title ─────────────────────────────────────────────────
function drawTitleImg() {
    const useClear = gameCleared && !titleImgAlt && titleImgCleared?.complete && titleImgCleared.naturalWidth > 0;
    const img = useClear ? titleImgCleared : titleImg;
    if (!img || !img.complete || img.naturalWidth === 0) return;
    // larger, anchored bottom-center, fully opaque (mascot as the hero)
    const targetW = W * 1.0;
    const scale = targetW / img.naturalWidth;
    const targetH = img.naturalHeight * scale;
    const x = (W - targetW) / 2;
    const y = H - targetH * 0.92;
    ctx.drawImage(img, x, y, targetW, targetH);
}

function drawTitle() {
    // Title always uses the deep-night background, regardless of stage state
    const c1 = '#0a0520', c2 = '#1a0535';
    const tgrad = ctx.createLinearGradient(0, 0, 0, H);
    tgrad.addColorStop(0, c1);
    tgrad.addColorStop(1, c2);
    ctx.fillStyle = tgrad;
    ctx.fillRect(0, 0, W, H);

    // accent glow at the bottom
    const tgh = ctx.createRadialGradient(W/2, H, 0, W/2, H, H*0.6);
    tgh.addColorStop(0, hexA(UI.accent, 0.10));
    tgh.addColorStop(1, hexA(UI.accent, 0));
    ctx.fillStyle = tgh;
    ctx.fillRect(0, H*0.5, W, H*0.5);

    // grid + stars
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    const gx = Math.max(60, W / 9), gy = Math.max(80, H / 14);
    for (let x = gx; x < W; x += gx) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = gy; y < H; y += gy) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    G.stars.forEach(s => {
        const a = Math.sin(G.frame * 0.04 + s.ph) * 0.35 + 0.55;
        ctx.globalAlpha = a * 0.55;
        ctx.beginPath();
        ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
        ctx.fillStyle = '#FFF'; ctx.fill();
    });
    ctx.globalAlpha = 1;

    drawTitleImg();

    const padX = 42;

    // Proportional Y positions — prevents overlap when canvas height changes
    const hTop   = Math.round(H * 0.024);  // top-bar center   (≈22 at H=900)
    const hLine1 = Math.round(H * 0.062);  // top hairline      (≈56)
    const hEye   = Math.round(H * 0.107);  // eyebrow row       (≈96)
    const wordSz = Math.round(Math.min(72, H * 0.082)); // scales down on small screens
    const hSky   = Math.round(H * 0.187);  // "Sky" baseline    (≈168)
    const hBurst = Math.round(H * 0.258);  // "Burst." baseline (≈232)
    const hSub   = Math.round(H * 0.291);  // subtitle row      (≈262)
    const hLine2 = Math.round(H * 0.309);  // bottom hairline   (≈278)

    // top hairline + meta
    hairline(padX, hLine1, W - padX, hLine1, UI.line);
    ctx.fillStyle = UI.accent;
    ctx.beginPath(); ctx.arc(padX + 4, hTop, 4, 0, Math.PI*2); ctx.fill();
    ctx.save();
    ctx.shadowColor = UI.accent; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(padX + 4, hTop, 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('SKY BURST', padX + 14, hTop);
    ctx.textAlign = 'right';
    if (gameCleared) {
        ctx.fillStyle = UI.accent;
        ctx.fillText('CLEARED ↻', W - padX, hTop);
        const tw = ctx.measureText('CLEARED ↻').width;
        G._clearedToggle = { x: W - padX - tw/2, y: hTop, w: tw + 16, h: 28 };
    }

    // Title block — eyebrow with pulsing dot
    const pulse = 0.5 + Math.sin(G.frame * 0.08) * 0.3;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = UI.accent2;
    ctx.beginPath(); ctx.arc(padX + 4, hEye, 3, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.font = `600 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.accent2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('LIVE · A FAN GAME FOR 42', padX + 14, hEye);

    // Big wordmark with subtle parallax
    const drift = Math.sin(G.frame * 0.02) * 2;
    ctx.font = `700 ${wordSz}px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('Sky', padX, hSky + drift);

    ctx.save();
    ctx.font = `500 italic ${wordSz}px ${UI.fontDisp}`;
    ctx.shadowColor = hexA(UI.accent, 0.6);
    ctx.shadowBlur = 20;
    ctx.fillStyle = UI.accent;
    ctx.fillText('Burst.', padX, hBurst + drift);
    ctx.restore();

    // Subtitle row with version tag
    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    ctx.fillText('FPS · BALLOON BUSTER', padX, hSub);
    ctx.textAlign = 'right';
    ctx.fillStyle = UI.ink2;
    ctx.fillText(`v${CONFIG.version}`, W - padX, hSub);
    hairline(padX, hLine2, W - padX, hLine2);

    // Rules block — with dim plate behind for legibility over mascot
    const rules = CONFIG.title.instructions;
    const lineH = 30;
    const rTop = Math.max(hLine2 + 24, Math.round(H * 0.38));
    const rH = lineH * rules.length + 36;

    ctx.save();
    const grad = ctx.createLinearGradient(0, rTop - 24, 0, rTop + rH + 8);
    grad.addColorStop(0, hexA('#0e0528', 0));
    grad.addColorStop(0.18, hexA('#0e0528', 0.82));
    grad.addColorStop(0.82, hexA('#0e0528', 0.82));
    grad.addColorStop(1, hexA('#0e0528', 0));
    ctx.fillStyle = grad;
    ctx.fillRect(0, rTop - 24, W, rH + 32);
    ctx.restore();

    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('HOW TO PLAY', padX, rTop - 6);

    rules.forEach((r, i) => {
        const y = rTop + i * lineH;
        hairline(padX, y, W - padX, y);
        if (i === rules.length - 1) hairline(padX, y + lineH, W - padX, y + lineH);
        ctx.font = `500 10px ${UI.fontMono}`;
        ctx.fillStyle = UI.ink2;
        ctx.textBaseline = 'middle';
        ctx.fillText(String(i+1).padStart(2, '0'), padX + 4, y + lineH/2);
        ctx.font = `400 13px ${UI.fontJa}`;
        ctx.fillStyle = i === 2 ? UI.accent2 : UI.ink1;
        ctx.fillText(r, padX + 32, y + lineH/2);
    });

    // START button — hard-edged accent rect
    const bw = W - padX*2, bh = 52;
    const bx = padX, by = H - 140;
    G._titleBtnY = by + bh/2;
    G._titleBtnW = bw;
    G._titleBtnH = bh;

    ctx.save();
    ctx.shadowColor = hexA(UI.accent, 0.5);
    ctx.shadowBlur = 30;
    ctx.fillStyle = UI.accent;
    rrect(bx, by, bw, bh, 4); ctx.fill();
    ctx.restore();

    ctx.font = `900 22px ${UI.fontDisp}`;
    ctx.fillStyle = UI.bg0;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    let cx = bx + 28;
    for (const ch of 'START') {
        ctx.fillText(ch, cx, by + bh/2);
        cx += ctx.measureText(ch).width + 3;
    }
    // chevron
    ctx.font = `700 22px ${UI.fontDisp}`;
    ctx.textAlign = 'right';
    ctx.fillText('>', bx + bw - 26, by + bh/2);

    // sub-label below
    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('TAP / CLICK / SPACE', W/2, by + bh + 16);

    // bottom meta
    hairline(padX, H - 38, W - padX, H - 38);
    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink3;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('AIM · POP', padX, H - 22);
    ctx.textAlign = 'center';
    ctx.fillText('FOR THE BIRTHDAY BOY · 42', W/2, H - 22);
    ctx.textAlign = 'right';
    ctx.fillText('BEST · 128', W - padX, H - 22);

    // reset button (small, bottom-right)
    if (gameCleared) {
        ctx.font = `500 9px ${UI.fontMono}`;
        ctx.fillStyle = UI.ink3;
        ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
        ctx.fillText('RESET', W - padX, H - 6);
        const rw = ctx.measureText('RESET').width;
        G._resetBtn = { x: W - padX - rw/2, y: H - 10, w: rw + 12, h: 18 };
    }

    // intro fade overlay
    if (G.titleFade < TITLE_FADE_FRAMES) {
        ctx.fillStyle = `rgba(5,7,20,${1 - G.titleFade / TITLE_FADE_FRAMES})`;
        ctx.fillRect(0, 0, W, H);
    }

}

// ── How-to image overlay ──────────────────────────────────
function drawHowto() {
    ctx.fillStyle = UI.bg0;
    ctx.fillRect(0, 0, W, H);
    if (!howtoImg || !howtoImg.complete || howtoImg.naturalWidth === 0) return;
    const pad = 32;
    const maxW = W - pad * 2, maxH = H - pad * 2;
    const scale = Math.min(maxW / howtoImg.naturalWidth, maxH / howtoImg.naturalHeight, 1);
    const iw = howtoImg.naturalWidth * scale, ih = howtoImg.naturalHeight * scale;
    const ix = (W - iw) / 2, iy = (H - ih) / 2;
    // border
    ctx.strokeStyle = UI.line2; ctx.lineWidth = 2;
    ctx.strokeRect(ix - 1, iy - 1, iw + 2, ih + 2);
    ctx.drawImage(howtoImg, ix, iy, iw, ih);
    // × close button (top-right of image)
    const btnSz = 44, btnX = ix + iw - btnSz / 2 + 8, btnY = iy - btnSz / 2 + 8;
    ctx.fillStyle = UI.bg0;
    ctx.fillRect(btnX - btnSz / 2, btnY - btnSz / 2, btnSz, btnSz);
    ctx.strokeStyle = UI.accent; ctx.lineWidth = 1;
    ctx.strokeRect(btnX - btnSz / 2 + 0.5, btnY - btnSz / 2 + 0.5, btnSz - 1, btnSz - 1);
    ctx.font = `400 22px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('✕', btnX, btnY);
    G._howtoClose = { x: btnX, y: btnY, w: btnSz, h: btnSz };
}

// ── Starting (countdown callout) ──────────────────────────
function drawStarting() {
    drawBg();
    drawTitleImg();
    if (G.frame < START_WAIT_FRAMES) return;
    const elapsed = G.frame - START_WAIT_FRAMES;
    const slideF = START_SLIDE_FRAMES;
    const slideY = elapsed < slideF ? (1 - elapsed / slideF) * 60 : 0;
    const alpha  = elapsed < slideF ? elapsed / slideF : 1;
    const bw = Math.min(W - 32, 300), bh = 72;
    const cx = W/2, cy = H*0.55 + slideY;
    ctx.save();
    ctx.globalAlpha = alpha;
    drawCallout(cx, cy, bw, bh, 'STAGE 1  //  GO', 'いっくよー！', 18);
    ctx.restore();
}

// ── Game render ───────────────────────────────────────────
function drawGame() {
    drawBg();
    G.items.forEach(it => { if (!it.popped) drawBalloon(it); });
    G.particles.forEach(p => {
        ctx.globalAlpha = p.life;
        if (p.type === 'text') {
            ctx.font = `600 13px ${UI.fontMono}`;
            ctx.fillStyle = p.color;
            ctx.textAlign = 'center';
            ctx.fillText(p.text, p.x, p.y);
        } else {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fillStyle = p.color; ctx.fill();
        }
        ctx.globalAlpha = 1;
    });
    drawHUD();

    // target lock when reticle is over a hazard
    let lock = false;
    for (const it of G.items) {
        if (it.popped || !it.def.hazard) continue;
        const dx = cursorX - it.x, dy = cursorY - it.y;
        if (dx*dx + dy*dy < R*R*1.8) { lock = true; break; }
    }
    drawReticle(lock);
}

function drawOverlay(alpha = 0.85) {
    ctx.fillStyle = hexA(UI.bg0, alpha);
    ctx.fillRect(0, 0, W, H);
}

// ── Pause ─────────────────────────────────────────────────
function drawPaused() {
    drawGame();
    drawOverlay(0.78);
    const padX = 20;

    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.accent;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('[ PAUSED ]', padX, H*0.32);

    ctx.font = `600 48px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.fillText('On hold.', padX, H*0.32 + 60);

    hairline(padX, H*0.42 + 40, W - padX, H*0.42 + 40);

    // resume btn
    const bw = W - padX*2, bh = 52;
    const rby = H*0.55;
    G._pauseResumeY = rby + bh/2;
    G._pauseQuitY = rby + bh + 16 + bh/2;

    ctx.save();
    ctx.shadowColor = hexA(UI.accent, 0.4);
    ctx.shadowBlur = 24;
    ctx.fillStyle = UI.accent;
    rrect(padX, rby, bw, bh, 4); ctx.fill();
    ctx.restore();
    ctx.font = `600 16px ${UI.fontDisp}`;
    ctx.fillStyle = UI.bg0;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('RESUME', W/2, rby + bh/2);

    // quit btn
    const qy = rby + bh + 16;
    ctx.strokeStyle = UI.line2; ctx.lineWidth = 1;
    ctx.strokeRect(padX + 0.5, qy + 0.5, bw - 1, bh - 1);
    ctx.font = `500 14px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink1;
    ctx.fillText('QUIT TO TITLE', W/2, qy + bh/2);

    drawReticle(false);
}

// ── Game Over ─────────────────────────────────────────────
function drawGameOver() {
    drawGame();
    drawOverlay(0.85);
    const padX = 42;

    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.accent2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('[ RUN ENDED ]', padX, H*0.22);

    ctx.font = `600 56px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.fillText('Game', padX, H*0.22 + 64);
    ctx.font = `500 italic 56px ${UI.fontDisp}`;
    ctx.fillStyle = UI.accent2;
    ctx.fillText('over.', padX, H*0.22 + 124);

    hairline(padX, H*0.22 + 150, W - padX, H*0.22 + 150);

    // score row
    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.fillText('FINAL SCORE', padX, H*0.55);
    ctx.font = `600 40px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.fillText(`${G.score}`.padStart(4, '0'), padX, H*0.55 + 44);

    // message
    ctx.font = `400 12px ${UI.fontJa}`;
    ctx.fillStyle = UI.ink2;
    const goMsg = G.si >= 2 ? CONFIG.gameOver.messageStage3 : CONFIG.gameOver.message;
    ctx.fillText(goMsg, padX, H*0.55 + 82);

    // retry btn
    const bw = W - padX*2, bh = 52;
    const by = H - 150;
    G._retryY = by + bh/2;
    ctx.save();
    ctx.shadowColor = hexA(UI.accent, 0.4);
    ctx.shadowBlur = 24;
    ctx.fillStyle = UI.accent;
    rrect(padX, by, bw, bh, 4); ctx.fill();
    ctx.restore();
    ctx.font = `600 16px ${UI.fontDisp}`;
    ctx.fillStyle = UI.bg0;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('TRY AGAIN', W/2, by + bh/2);

    // Icon button row: X share + chicken
    const iconSz = 52, iconGap = 12;
    const iconY = by + bh + 20 + iconSz / 2;
    const goXBtnX = W/2 - (iconSz + iconGap) / 2;
    const goChBtnX = W/2 + (iconSz + iconGap) / 2;
    G._goXBtnX = goXBtnX; G._goXBtnY = iconY;
    G._goChBtnX = goChBtnX; G._goChBtnY = iconY;
    G._goIconSz = iconSz;

    ctx.strokeStyle = UI.line2; ctx.lineWidth = 1;
    ctx.strokeRect(goXBtnX - iconSz/2 + 0.5, iconY - iconSz/2 + 0.5, iconSz - 1, iconSz - 1);
    ctx.font = `600 22px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('𝕏', goXBtnX, iconY);

    ctx.strokeStyle = UI.line2;
    ctx.strokeRect(goChBtnX - iconSz/2 + 0.5, iconY - iconSz/2 + 0.5, iconSz - 1, iconSz - 1);
    if (chickenImg && chickenImg.complete && chickenImg.naturalWidth > 0) {
        ctx.drawImage(chickenImg, goChBtnX - iconSz/2 + 4, iconY - iconSz/2 + 4, iconSz - 8, iconSz - 8);
    } else {
        ctx.font = `26px serif`; ctx.fillText('🐔', goChBtnX, iconY + 2);
    }

    // Chicken popup
    if (G.goChickenPopup) {
        const lines = (CONFIG.ending.chickenMessage || '').split('\n');
        const lineH = 22;
        const authorH = CONFIG.ending.chickenAuthor ? 18 : 0;
        const popW = Math.min(W - padX * 2, 300);
        const popH = lines.length * lineH + 28 + authorH;
        const popX = W/2 - popW/2;
        const popY = iconY - iconSz/2 - 16 - popH;
        ctx.fillStyle = UI.bg1;
        ctx.fillRect(popX, popY, popW, popH);
        ctx.strokeStyle = UI.accent; ctx.lineWidth = 1;
        ctx.strokeRect(popX + 0.5, popY + 0.5, popW - 1, popH - 1);
        ctx.font = `400 13px ${UI.fontJa}`;
        ctx.fillStyle = UI.ink0;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        lines.forEach((line, i) => {
            ctx.fillText(line, W/2, popY + (popH - authorH - lines.length * lineH) / 2 + (i + 0.5) * lineH);
        });
        if (CONFIG.ending.chickenAuthor) {
            ctx.font = `400 10px ${UI.fontMono}`;
            ctx.fillStyle = UI.ink2;
            ctx.fillText(CONFIG.ending.chickenAuthor, W/2, popY + popH - 10);
        }
        const tailX = goChBtnX;
        const tailY0 = popY + popH;
        const tailY1 = iconY - iconSz / 2 - 2;
        ctx.strokeStyle = UI.accent; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(tailX, tailY0);
        ctx.lineTo(tailX, tailY1);
        ctx.stroke();
        ctx.fillStyle = UI.accent;
        ctx.beginPath();
        ctx.arc(tailX, tailY1, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineCap = 'butt';
    }
}

// ── Ending ────────────────────────────────────────────────
function drawEnding() {
    drawBg();
    // hard reset of canvas state to avoid any leak from prior frames
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.filter = 'none';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    // confetti
    G.confetti.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y); ctx.rotate(c.rot);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
        ctx.restore();
    });

    // bouncers (background mascot fragments)
    G.bouncers.forEach((b, bi) => {
        const cand = bouncerImgs[bi];
        const img = (cand && cand.complete && cand.naturalWidth > 0) ? cand
                  : (titleImg && titleImg.complete && titleImg.naturalWidth > 0) ? titleImg
                  : null;
        ctx.save();
        ctx.globalAlpha = 0.85;
        if (img) {
            const r = b.size / 2;
            ctx.beginPath();
            ctx.rect(b.x - r, b.y - r, b.size, b.size);
            ctx.clip();
            ctx.drawImage(img, b.x - r, b.y - r, b.size, b.size);
            //ctx.strokeStyle = UI.accent;
            //ctx.lineWidth = 1;
            //ctx.strokeRect(b.x - r + 0.5, b.y - r + 0.5, b.size - 1, b.size - 1);
        }
        ctx.restore();
    });

    G.particles.forEach(p => {
        ctx.globalAlpha = p.life;
        if (p.type !== 'text') {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fillStyle = p.color; ctx.fill();
        }
        ctx.globalAlpha = 1;
    });

    const padX = 20;

    // top hairline + meta
    hairline(padX, 56, W - padX, 56);
    ctx.fillStyle = UI.accent;
    ctx.beginPath(); ctx.arc(padX + 4, 22, 4, 0, Math.PI*2); ctx.fill();
    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('SKY BURST  ·  CLEARED', padX + 14, 22);
    ctx.textAlign = 'right';
    ctx.fillText('PERFECT 42', W - padX, 22);

    // Hero text
    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.accent;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('[ CONGRATULATIONS ]', padX, H * 0.13);

    ctx.font = `600 56px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.fillText('Happy', padX, H * 0.20);
    ctx.font = `500 italic 56px ${UI.fontDisp}`;
    ctx.fillStyle = UI.accent;
    ctx.fillText('42.', padX, H * 0.27);

    ctx.font = `400 14px ${UI.fontJa}`;
    ctx.fillStyle = UI.ink1;
    ctx.fillText(CONFIG.ending.message, padX, H * 0.31);
    hairline(padX, H * 0.33, W - padX, H * 0.33);

    // Score row
    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('FINAL SCORE', padX, H * 0.38);
    ctx.font = `600 56px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.fillText(`${G.score}`.padStart(4, '0'), padX, H * 0.45);

    // Stats grid
    const sy = H * 0.50;
    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.fillText('STAGES CLEARED', padX, sy);
    ctx.fillText('STATUS', W/2, sy);
    ctx.font = `600 22px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.fillText(`${STAGES.length}/${STAGES.length}`, padX, sy + 28);
    const statusEntry = CONFIG.ending.status.find(s => G.missed <= s.max) || CONFIG.ending.status[CONFIG.ending.status.length - 1];
    ctx.fillStyle = G.missed === 0 ? UI.accent : UI.ink0;
    ctx.fillText(statusEntry.label, W/2, sy + 28);
    hairline(padX, sy + 48, W - padX, sy + 48);

    // Replay btn
    const bw = W - padX*2, bh = 56;
    const by = H - 170;
    G._replayY = by + bh/2;
    ctx.save();
    ctx.shadowColor = hexA(UI.accent, 0.5);
    ctx.shadowBlur = 30;
    ctx.fillStyle = UI.accent;
    rrect(padX, by, bw, bh, 4); ctx.fill();
    ctx.restore();
    ctx.font = `600 18px ${UI.fontDisp}`;
    ctx.fillStyle = UI.bg0;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('PLAY AGAIN', W/2, by + bh/2);

    // Icon button row: X share + chicken
    const iconSz = 52, iconGap = 12;
    const iconY = by + bh + 20 + iconSz / 2;
    const xBtnX = W/2 - (iconSz + iconGap) / 2;
    const chBtnX = W/2 + (iconSz + iconGap) / 2;
    G._xBtnX = xBtnX; G._xBtnY = iconY;
    G._chBtnX = chBtnX; G._chBtnY = iconY;
    G._iconSz = iconSz;

    const locked = G.endingInputDelay > 0;
    ctx.globalAlpha = locked ? 0.35 : 1;

    ctx.strokeStyle = UI.line2; ctx.lineWidth = 1;
    ctx.strokeRect(xBtnX - iconSz/2 + 0.5, iconY - iconSz/2 + 0.5, iconSz - 1, iconSz - 1);
    ctx.font = `600 22px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('𝕏', xBtnX, iconY);

    ctx.strokeStyle = UI.line2;
    ctx.strokeRect(chBtnX - iconSz/2 + 0.5, iconY - iconSz/2 + 0.5, iconSz - 1, iconSz - 1);
    if (chickenImg && chickenImg.complete && chickenImg.naturalWidth > 0) {
        ctx.drawImage(chickenImg, chBtnX - iconSz/2 + 4, iconY - iconSz/2 + 4, iconSz - 8, iconSz - 8);
    } else {
        ctx.font = `26px serif`; ctx.fillText('🐔', chBtnX, iconY + 2);
    }

    ctx.globalAlpha = 1;

    // Chicken popup (box callout + vertical line tail to chicken icon)
    if (G.endingChickenPopup) {
        const lines = (CONFIG.ending.chickenMessage || '').split('\n');
        const lineH = 22;
        const authorH = CONFIG.ending.chickenAuthor ? 18 : 0;
        const popW = Math.min(W - padX * 2, 300);
        const popH = lines.length * lineH + 28 + authorH;
        const popX = W/2 - popW/2;
        const popY = iconY - iconSz/2 - 16 - popH;
        // box
        ctx.fillStyle = UI.bg1;
        ctx.fillRect(popX, popY, popW, popH);
        ctx.strokeStyle = UI.accent; ctx.lineWidth = 1;
        ctx.strokeRect(popX + 0.5, popY + 0.5, popW - 1, popH - 1);
        // text
        ctx.font = `400 13px ${UI.fontJa}`;
        ctx.fillStyle = UI.ink0;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        lines.forEach((line, i) => {
            ctx.fillText(line, W/2, popY + (popH - authorH - lines.length * lineH) / 2 + (i + 0.5) * lineH);
        });
        if (CONFIG.ending.chickenAuthor) {
            ctx.font = `400 10px ${UI.fontMono}`;
            ctx.fillStyle = UI.ink2;
            ctx.fillText(CONFIG.ending.chickenAuthor, W/2, popY + popH - 10);
        }
        // vertical line tail pointing down to chicken icon top
        const tailX = chBtnX;
        const tailY0 = popY + popH;
        const tailY1 = iconY - iconSz / 2 - 2;
        ctx.strokeStyle = UI.accent; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(tailX, tailY0);
        ctx.lineTo(tailX, tailY1);
        ctx.stroke();
        ctx.fillStyle = UI.accent;
        ctx.beginPath();
        ctx.arc(tailX, tailY1, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineCap = 'butt';
    }
}

// ── Update ────────────────────────────────────────────────
function update() {
    if (G.phase === 'paused') return;
    G.frame++;

    if (G.phase === 'loading') {
        // wait for video ready, with a 10-second hard timeout
        const videoOk = introVideoReady || G.frame >= LOADING_FRAMES + 600;
        if (G.frame >= LOADING_FRAMES && videoOk) {
            G.phase = 'intro';
            G.introSub = introVideo ? 'video' : 'balloons';
            G.frame = 0;
            G.introFade = 0;
            if (introVideo) introVideo.play().catch(() => { introVideoEnded = true; });
        }
        return;
    }
    if (G.phase === 'intro') {
        if (G.introSub === 'video') {
            if (introVideoEnded) { G.introSub = 'fade'; G.introFade = 0; }
        } else if (G.introSub === 'fade') {
            G.introFade++;
            if (G.introFade >= INTRO_FADE_FRAMES) { G.phase = 'title'; G.frame = 0; G.titleFade = 0; }
        } else {
            // skip balloon intro entirely
            G.phase = 'title'; G.frame = 0; G.titleFade = 0;
        }
        return;
    }
    if (G.phase === 'title') {
        if (G.titleFade < TITLE_FADE_FRAMES) G.titleFade++;
    }
    if (G.phase === 'starting') {
        if (G.frame >= START_TOTAL_FRAMES) { G.phase = 'playing'; G.frame = 0; }
    }
    if (G.phase === 'playing') {
        const stage = STAGES[G.si];
        if (G.frame % stage.interval === 0) {
            spawnItem();
            if (G.si >= 1 && G.frame % (stage.interval*2) === 0) spawnItem();
        }
        G.items = G.items.filter(it => {
            if (it.popped) return false;
            it.y += it.vy; it.x += it.vx;
            it.wobble += 0.025;
            it.x += Math.sin(it.wobble) * 0.35;
            if (it.y <= -R*3) {
                if (!it.def.hazard) G.missed++;
                return false;
            }
            return true;
        });
        if (G.combo > 1 && Date.now() - G.lastPop > COMBO_MS) G.combo = 1;
        if (G.bgT < 1) G.bgT = Math.min(G.bgT + 0.018, 1);
        if (G.stageFlash > 0) G.stageFlash--;
        if (G.slowTimer > 0) G.slowTimer--;
    }
    if (G.phase === 'ending') {
        if (G.endingInputDelay > 0) G.endingInputDelay--;
        G.confetti.forEach(c => {
            c.x += c.vx; c.y += c.vy; c.rot += c.rotV;
            if (c.y > H + 20) { c.y = -10; c.x = Math.random()*W; }
        });
        if (G.frame % 75 === 0) {
            const cols = [UI.accent, UI.accent2, '#FFD700', '#A78BFA'];
            burst(Math.random()*W, Math.random()*H*0.6, cols[G.frame%cols.length], 18);
        }
        G.bouncers.forEach((b, bi) => {
            if (b.x === 0) { b.x = W*(0.3 + bi*0.4); b.y = H*0.3; }
            b.x += b.vx; b.y += b.vy;
            b.vy += 0.10;
            const r = b.size/2;
            if (b.x - r < 0)  { b.x = r;   b.vx =  Math.abs(b.vx)*0.92; }
            if (b.x + r > W)  { b.x = W-r; b.vx = -Math.abs(b.vx)*0.92; }
            if (b.y - r < 0)  { b.y = r;   b.vy =  Math.abs(b.vy)*0.85; }
            if (b.y + r > H)  { b.y = H-r; b.vy = -Math.abs(b.vy)*0.88;
                                b.vx += (Math.random()-0.5)*1.5; }
        });
    }
    G.particles = G.particles.filter(p => {
        p.life -= p.type === 'text' ? 0.014 : 0.028;
        p.x += p.vx; p.y += p.vy;
        if (p.type !== 'text') { p.vy += 0.12; p.vx *= 0.97; }
        return p.life > 0;
    });
}

// ── Render dispatch ───────────────────────────────────────
function render() {
    ctx.clearRect(0, 0, W, H);
    canvas.style.cursor = (G.phase === 'playing' || G.phase === 'paused') ? 'none' : '';
    switch(G.phase) {
        case 'loading':  drawLoading();  break;
        case 'intro':    drawIntro();    break;
        case 'title':    drawTitle();    break;
        case 'howto':    drawHowto();    break;
        case 'starting': drawStarting(); break;
        case 'playing':  drawGame();     break;
        case 'paused':   drawPaused();   break;
        case 'gameOver': drawGameOver(); break;
        case 'ending':   drawEnding();   break;
    }
}
const TICK_MS = 1000 / 60;
let _lastTime = 0, _accum = 0;
function loop(now) {
    if (_lastTime) {
        _accum += Math.min(now - _lastTime, 200);
        while (_accum >= TICK_MS) { update(); _accum -= TICK_MS; }
    }
    _lastTime = now;
    render();
    requestAnimationFrame(loop);
}

// ── Input ─────────────────────────────────────────────────
function getXY(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = W / rect.width, sy = H / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - rect.left) * sx, y: (src.clientY - rect.top) * sy };
}
function inRect(x, y, cx, cy, w, h) {
    return Math.abs(x-cx) < w/2 && Math.abs(y-cy) < h/2;
}

function onInput(e) {
    e.preventDefault();
    const { x, y } = getXY(e);
    switch(G.phase) {
        case 'title':
            if (inRect(x, y, W/2, G._titleBtnY ?? H*0.85, G._titleBtnW ?? W-40, G._titleBtnH ?? 56)) {
                G.phase = 'howto'; G.frame = 0;
            } else if (gameCleared && G._clearedToggle && inRect(x, y, G._clearedToggle.x, G._clearedToggle.y, G._clearedToggle.w, G._clearedToggle.h)) {
                titleImgAlt = !titleImgAlt;
            } else if (gameCleared && G._resetBtn && inRect(x, y, G._resetBtn.x, G._resetBtn.y, G._resetBtn.w, G._resetBtn.h)) {
                resetCleared(); titleImgAlt = false;
            }
            break;
        case 'howto':
            if (G._howtoClose && inRect(x, y, G._howtoClose.x, G._howtoClose.y, G._howtoClose.w, G._howtoClose.h)) {
                G.phase = 'starting'; G.frame = 0;
            }
            break;
        case 'playing':
            if (G._pauseBtn && inRect(x, y, G._pauseBtn.x, G._pauseBtn.y, G._pauseBtn.w, G._pauseBtn.h)) {
                G.phase = 'paused';
            } else { tryPop(x, y); }
            break;
        case 'paused':
            if (inRect(x, y, W/2, G._pauseResumeY ?? H*0.55, W - 40, 52)) G.phase = 'playing';
            else if (inRect(x, y, W/2, G._pauseQuitY ?? H*0.65, W - 40, 52)) replayState();
            break;
        case 'gameOver':
            if (G.goChickenPopup) { G.goChickenPopup = false; return; }
            if (inRect(x, y, W/2, G._retryY ?? H*0.85, W - 40, 52)) {
                replayState();
            } else if (inRect(x, y, G._goXBtnX ?? W/2 - 32, G._goXBtnY ?? H*0.9, G._goIconSz ?? 52, G._goIconSz ?? 52)) {
                const txt = `SKY BURST · 42 スコア: ${G.score} #SKYBURST42`;
                window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(txt)}`, '_blank');
            } else if (inRect(x, y, G._goChBtnX ?? W/2 + 32, G._goChBtnY ?? H*0.9, G._goIconSz ?? 52, G._goIconSz ?? 52)) {
                G.goChickenPopup = true;
            }
            break;
        case 'ending':
            if (G.endingInputDelay > 0) return;
            if (G.endingChickenPopup) { G.endingChickenPopup = false; return; }
            if (inRect(x, y, W/2, G._replayY ?? H*0.85, W - 40, 56)) {
                replayState();
            } else if (inRect(x, y, G._xBtnX ?? W/2 - 32, G._xBtnY ?? H*0.9, G._iconSz ?? 52, G._iconSz ?? 52)) {
                const txt = `SKY BURST · 42 をクリア！🎈 スコア: ${G.score} #SKYBURST42`;
                canvas.toBlob(blob => {
                    const file = new File([blob], 'skyburst42.png', { type: 'image/png' });
                    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({ files: [file], title: 'SKY BURST · 42', text: txt }).catch(() => {});
                    } else {
                        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(txt)}`, '_blank');
                    }
                }, 'image/png');
            } else if (inRect(x, y, G._chBtnX ?? W/2 + 32, G._chBtnY ?? H*0.9, G._iconSz ?? 52, G._iconSz ?? 52)) {
                G.endingChickenPopup = true;
            }
            break;
    }
}
canvas.addEventListener('click', onInput);
canvas.addEventListener('touchstart', onInput, { passive: false });

// debug shortcuts: E=ending, O=gameover, T=title, P=playing
window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'e') {
        G.score = 6000; G.si = STAGES.length - 1; G.stagePts = STAGES[G.si].target;
        spawnConfetti(); setCleared(); G.phase = 'ending'; G.frame = 0; G.endingInputDelay = 90;
    } else if (k === 'o') {
        G.score = 1234; G.lives = 0; G.phase = 'gameOver';
    } else if (k === 't') {
        replayState();
    } else if (k === 'p') {
        G.phase = 'playing'; G.frame = 0;
    } else if (k === ' ' || k === 'enter') {
        if (G.phase === 'title') { G.phase = 'starting'; G.frame = 0; }
    }
});

function updateCursor(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = W / rect.width, sy = H / rect.height;
    const src = e.touches ? e.touches[0] : e;
    if (src) { cursorX = (src.clientX - rect.left)*sx; cursorY = (src.clientY - rect.top)*sy; }
}
canvas.addEventListener('mousemove', updateCursor);
canvas.addEventListener('touchmove', updateCursor, { passive: true });
canvas.addEventListener('touchstart', updateCursor, { passive: true });
canvas.addEventListener('mouseleave', () => { cursorX = -999; cursorY = -999; });

function replayState() { initState(); G.phase = 'title'; G.frame = 0; }
initState();
requestAnimationFrame(loop);
</script>
