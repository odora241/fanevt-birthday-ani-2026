<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SKY BURST · 42</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="c"></canvas>
<script src="./config.js"></script>
<script>
// ==========================================================
//  SKY BURST · 42 — Redesigned
//  Dark-neon UI shell. Game logic preserved; visuals reskinned.
// ==========================================================

const CUSTOM = {
    ...CONFIG.assets,
    name:     CONFIG.ending.message,
    subtitle: CONFIG.ending.subtitle,
    theme:    CONFIG.theme,
};
const STAGES       = CONFIG.stages;
const STAGE_UP_MSG = CONFIG.stageUpMessages;

// ── Design tokens (UI shell — game items keep their original colors) ─────
const UI = {
    bg0:      '#050714',
    bg1:      '#0a0e1f',
    accent:   '#6df0ff',
    accent2:  '#ff7a8a',   // warn / target lock
    ink0:     '#f4f6ff',
    ink1:     '#c8cce8',
    ink2:     '#7a80a8',
    ink3:     '#3f4570',
    line:     'rgba(255,255,255,0.10)',
    line2:    'rgba(255,255,255,0.18)',
    fontDisp: '"Space Grotesk", system-ui, sans-serif',
    fontMono: '"JetBrains Mono", ui-monospace, monospace',
    fontJa:   '"Noto Sans JP", system-ui, sans-serif',
};

// Item defs from CONFIG
const DEFS = {};
Object.entries(CONFIG.items).forEach(([k, d]) => {
    DEFS[k] = {
        label: d.label, pts: d.pts, w: d.w, color: d.color, bg: d.bg,
        hazard: d.hazard ?? false, special: d.special ?? false, slow: d.slow ?? false,
    };
});

const R        = 36;
const COMBO_MS = 1500;

// timing
const LOADING_FRAMES        = 100;
const INTRO_FADE_FRAMES     = 30;
const INTRO_BALLOON_FRAMES  = 210;
const INTRO_BALLOON_FADEIN  = 40;
const INTRO_BALLOON_FADEOUT = 20;
const TITLE_FADE_FRAMES     = 40;
const STAGE_FLASH_FRAMES    = 160;
const STAGE_FLASH_SLIDE     = 22;
const START_WAIT_FRAMES     = 60;
const START_SLIDE_FRAMES    = 15;
const START_TOTAL_FRAMES    = 210;
const SLOW_FRAMES           = 210;
const RETICLE_SIZE          = 80;

// ── Canvas setup ──────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;
function resize() {
    const aspect = 9 / 16;
    H = Math.min(window.innerHeight, 1100);
    W = Math.min(window.innerWidth, H * aspect, 560);
    H = Math.min(H, W / aspect);
    canvas.width  = Math.floor(W);
    canvas.height = Math.floor(H);
    W = canvas.width;
    H = canvas.height;
}
resize();
window.addEventListener('resize', resize);

// ── Asset loading ─────────────────────────────────────────
function loadImg(src) { const img = new Image(); img.src = src; return img; }
let fanArtImg = CUSTOM.fanArtSrc ? loadImg(CUSTOM.fanArtSrc) : null;
const bouncerSrcs = CUSTOM.bouncerSrc
    ? (Array.isArray(CUSTOM.bouncerSrc) ? CUSTOM.bouncerSrc : [CUSTOM.bouncerSrc]) : [];
const bouncerImgs = bouncerSrcs.map(s => loadImg(s));
let titleImg        = CUSTOM.titleImgSrc        ? loadImg(CUSTOM.titleImgSrc)        : null;
let titleImgCleared = CUSTOM.titleImgClearedSrc ? loadImg(CUSTOM.titleImgClearedSrc) : null;
let reticleImg      = CUSTOM.reticleSrc         ? loadImg(CUSTOM.reticleSrc)         : null;

const CLEARED_KEY = 'sky-burst-42-cleared';
let gameCleared = sessionStorage.getItem(CLEARED_KEY) === '1';
function setCleared() { gameCleared = true;  sessionStorage.setItem(CLEARED_KEY, '1'); }
function resetCleared() { gameCleared = false; sessionStorage.removeItem(CLEARED_KEY); }

let introVideo = null;
let introVideoEnded = false;
if (CUSTOM.introVideoSrc) {
    introVideo = document.createElement('video');
    introVideo.src = CUSTOM.introVideoSrc;
    introVideo.muted = true;
    introVideo.playsInline = true;
    introVideo.preload = 'auto';
    introVideo.style.cssText = 'position:fixed;opacity:0;pointer-events:none;width:1px;height:1px';
    document.body.appendChild(introVideo);
    introVideo.addEventListener('ended', () => { introVideoEnded = true; });
    introVideo.addEventListener('error', () => { introVideoEnded = true; });
}

// reticle tint cache
let _retCache = null;
function tintedReticle(color) {
    if (!reticleImg || !reticleImg.complete || reticleImg.naturalWidth === 0) return null;
    if (_retCache && _retCache.color === color) return _retCache.canvas;
    const off = document.createElement('canvas');
    off.width = reticleImg.naturalWidth; off.height = reticleImg.naturalHeight;
    const o = off.getContext('2d');
    o.drawImage(reticleImg, 0, 0);
    o.globalCompositeOperation = 'source-in';
    o.fillStyle = color;
    o.fillRect(0, 0, off.width, off.height);
    _retCache = { color, canvas: off };
    return off;
}

// ── State ─────────────────────────────────────────────────
let G;
function initState() {
    G = {
        phase: 'loading', frame: 0,
        introSub: 'video', introFade: 0,
        score: 0, combo: 1, lives: 3,
        si: 0, stagePts: 0,
        items: [], particles: [], confetti: [],
        lastPop: 0,
        pool: buildPool(0),
        stars: buildStars(),
        bgT: 1,
        bgFrom: { bg1: STAGES[0].bg1, bg2: STAGES[0].bg2 },
        stageFlash: 0, stageFlashMsg: 0,
        introAlpha: 0, titleFade: 0,
        slowTimer: 0,
        bouncers: [
            { x: 0, y: 0, vx:  1.5, vy: -1.8, size: 86 },
            { x: 0, y: 0, vx: -1.2, vy: -1.6, size: 86 },
        ],
    };
}
function buildStars() {
    return Array.from({length: 56}, () => ({
        x: Math.random(), y: Math.random() * 0.85,
        r: 0.4 + Math.random() * 1.4,
        ph: Math.random() * Math.PI * 2,
    }));
}
function buildPool(si) {
    const bw = STAGES[si].bombW;
    const pool = [];
    Object.entries(DEFS).forEach(([k, d]) => {
        const wt = d.hazard ? bw : d.w;
        for (let i = 0; i < wt; i++) pool.push(k);
    });
    return pool;
}

// ── Spawn ─────────────────────────────────────────────────
function spawnItem() {
    const type = G.pool[Math.floor(Math.random() * G.pool.length)];
    const def  = DEFS[type];
    const sf   = G.slowTimer > 0 ? 0.55 : 1;
    const spd  = (STAGES[G.si].speed + Math.random() * 0.8) * sf;
    G.items.push({
        type, def,
        x: R + Math.random() * (W - R*2),
        y: H + R + 12,
        vy: -spd,
        vx: (Math.random() - 0.5) * 0.4,
        wobble: Math.random() * Math.PI * 2,
        popped: false,
    });
}

// ── Particles ─────────────────────────────────────────────
function burst(x, y, color, n=12) {
    for (let i=0; i<n; i++) {
        const a = (Math.PI*2/n)*i + Math.random()*0.5;
        const s = 2 + Math.random()*5;
        G.particles.push({ type:'dot', x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, r:3+Math.random()*4, color, life:1 });
    }
}
function floatText(x, y, text, color) {
    G.particles.push({ type:'text', x, y, vy:-1.6, vx:0, text, color, life:1 });
}
function spawnConfetti() {
    const cols = ['#6df0ff', '#ff7a8a', '#FFD700', '#A78BFA', '#6EE7B7', '#ffffff'];
    G.confetti = Array.from({length: 200}, () => ({
        x: Math.random()*W, y: -20 - Math.random()*H,
        vy: 1.2 + Math.random()*2, vx: (Math.random()-0.5)*1.5,
        color: cols[Math.floor(Math.random()*cols.length)],
        w: 6 + Math.random()*8, h: 3 + Math.random()*5,
        rot: Math.random()*Math.PI, rotV: (Math.random()-0.5)*0.18,
    }));
}

// ── Pop ───────────────────────────────────────────────────
function tryPop(px, py) {
    if (G.phase !== 'playing') return;
    for (let i=G.items.length-1; i>=0; i--) {
        const it = G.items[i];
        if (it.popped) continue;
        const dx = px - it.x, dy = py - it.y;
        if (dx*dx + dy*dy < R*R*1.8) { it.popped = true; onPop(it); return; }
    }
}
function onPop(it) {
    const now = Date.now();
    if (it.def.hazard) {
        G.combo = 1;
        G.lives = Math.max(0, G.lives - 1);
        burst(it.x, it.y, UI.accent2, 10);
        floatText(it.x, it.y - 20, 'MISS −1', UI.accent2);
        if (G.lives <= 0) setTimeout(() => G.phase = 'gameOver', 400);
    } else {
        G.combo   = (now - G.lastPop < COMBO_MS) ? Math.min(G.combo + 1, 8) : 1;
        G.lastPop = now;
        const pts = it.def.pts * G.combo;
        G.score    += pts;
        G.stagePts += pts;
        burst(it.x, it.y, it.def.color, it.def.special ? 22 : 12);
        if (it.def.slow) {
            if (G.slowTimer === 0) G.items.forEach(t => { if (!t.popped) t.vy *= 0.55; });
            G.slowTimer = SLOW_FRAMES;
            floatText(it.x, it.y - 24, `+${pts}  SLOW`, '#6EE7B7');
        } else {
            floatText(it.x, it.y - 24,
                G.combo > 1 ? `+${pts}  ×${G.combo}` : `+${pts}`,
                G.combo > 2 ? UI.accent : '#FFF');
        }
        if (G.stagePts >= STAGES[G.si].target) {
            if (G.si >= STAGES.length - 1) {
                setCleared();
                setTimeout(() => { spawnConfetti(); G.phase = 'ending'; }, 350);
            } else {
                G.bgFrom = { bg1: STAGES[G.si].bg1, bg2: STAGES[G.si].bg2 };
                G.bgT = 0; G.si++;
                G.stagePts = 0;
                G.pool = buildPool(G.si);
                G.stageFlash = STAGE_FLASH_FRAMES;
                G.stageFlashMsg = G.si - 1;
            }
        }
    }
}

// ── Helpers ───────────────────────────────────────────────
function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
}
function lerpHex(a, b, t) {
    const p = s => [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)];
    const [ar,ag,ab] = p(a), [br,bg,bb] = p(b);
    const r = Math.round(ar+(br-ar)*t), g = Math.round(ag+(bg-ag)*t), bv = Math.round(ab+(bb-ab)*t);
    return '#' + [r,g,bv].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function hexA(hex, a) {
    if (!hex.startsWith('#')) return hex;
    let h = hex.replace('#','');
    if (h.length === 3) h = h.split('').map(c=>c+c).join('');
    const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
    return `rgba(${r},${g},${b},${a})`;
}

// hairline rule with pad
function hairline(x1, y1, x2, y2, color = UI.line) {
    ctx.strokeStyle = color; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

// ── Background ────────────────────────────────────────────
function drawBg() {
    const t   = G.bgT ?? 1;
    const cur = STAGES[G.si] ?? STAGES[STAGES.length-1];
    const c1  = G.bgFrom ? lerpHex(G.bgFrom.bg1, cur.bg1, t) : cur.bg1;
    const c2  = G.bgFrom ? lerpHex(G.bgFrom.bg2, cur.bg2, t) : cur.bg2;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, c1);
    grad.addColorStop(1, c2);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // accent glow at the bottom (where balloons spawn)
    const gh = ctx.createRadialGradient(W/2, H, 0, W/2, H, H*0.6);
    gh.addColorStop(0, hexA(UI.accent, 0.10));
    gh.addColorStop(1, hexA(UI.accent, 0));
    ctx.fillStyle = gh;
    ctx.fillRect(0, H*0.5, W, H*0.5);

    // grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    const gx = Math.max(60, W / 9);
    const gy = Math.max(80, H / 14);
    for (let x = gx; x < W; x += gx) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = gy; y < H; y += gy) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // stars
    const starAlphaBase = 0.10 + 0.55 * (G.si / (STAGES.length - 1));
    G.stars.forEach(s => {
        const a = Math.sin(G.frame * 0.04 + s.ph) * 0.35 + 0.55;
        ctx.globalAlpha = a * starAlphaBase;
        ctx.beginPath();
        ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
        ctx.fillStyle = '#FFF';
        ctx.fill();
    });
    ctx.globalAlpha = 1;
}

// ── Items ─────────────────────────────────────────────────
function puffyStarPath(cx, cy, outerR, innerR, n) {
    ctx.beginPath();
    for (let i=0; i<n; i++) {
        const outerA = (i*2*Math.PI/n) - Math.PI/2;
        const innerA1 = outerA - Math.PI/n, innerA2 = outerA + Math.PI/n;
        const ix1 = cx + Math.cos(innerA1)*innerR, iy1 = cy + Math.sin(innerA1)*innerR;
        const ox  = cx + Math.cos(outerA)*outerR,  oy  = cy + Math.sin(outerA)*outerR;
        const ix2 = cx + Math.cos(innerA2)*innerR, iy2 = cy + Math.sin(innerA2)*innerR;
        if (i === 0) ctx.moveTo(ix1, iy1); else ctx.lineTo(ix1, iy1);
        ctx.quadraticCurveTo(ox, oy, ix2, iy2);
    }
    ctx.closePath();
}
function drawBalloon(it) {
    ctx.save();
    if (it.def.slow) {
        const bg = ctx.createRadialGradient(it.x - R*0.28, it.y - R*0.28, 2, it.x, it.y, R);
        bg.addColorStop(0, it.def.color + 'EE');
        bg.addColorStop(1, it.def.bg    + 'CC');
        ctx.fillStyle = bg;
        ctx.shadowColor = it.def.color; ctx.shadowBlur = 16;
        puffyStarPath(it.x, it.y, R, R*0.52, 5);
        ctx.fill(); ctx.shadowBlur = 0;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = `${R*0.95}px serif`;
        ctx.fillText(it.def.label, it.x, it.y + 2);
        ctx.textBaseline = 'alphabetic'; ctx.restore(); return;
    }
    if (!it.def.hazard) {
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255,255,255,0.22)';
        ctx.lineWidth = 1.5;
        ctx.moveTo(it.x, it.y + R);
        ctx.lineTo(it.x, it.y + R + 14);
        ctx.stroke();
    }
    const bg = ctx.createRadialGradient(it.x - R*0.28, it.y - R*0.28, 2, it.x, it.y, R);
    bg.addColorStop(0, it.def.color + 'EE');
    bg.addColorStop(1, it.def.bg    + 'CC');
    ctx.beginPath();
    ctx.arc(it.x, it.y, R, 0, Math.PI*2);
    ctx.fillStyle = bg;
    ctx.shadowColor = it.def.color; ctx.shadowBlur = 14;
    ctx.fill(); ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(it.x - R*0.28, it.y - R*0.28, R*0.18, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.38)'; ctx.fill();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${R*1.05}px serif`;
    ctx.fillText(it.def.label, it.x, it.y + 2);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
}

// ── HUD ───────────────────────────────────────────────────
const PAUSE_BTN = { size: 40 };

function drawHUD() {
    const padX = 16;

    // top hairline
    hairline(padX, 56, W - padX, 56, UI.line);

    // dot + STAGE label (left)
    ctx.fillStyle = UI.accent;
    ctx.beginPath(); ctx.arc(padX + 4, 22, 4, 0, Math.PI*2); ctx.fill();
    ctx.save();
    ctx.shadowColor = UI.accent; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(padX + 4, 22, 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(`STAGE ${G.si+1} / ${STAGES.length}`, padX + 16, 22);

    // lives (right) — ticks first, then LIFE label to the left of them
    const livesX = W - padX;
    const tickW = 8, tickGap = 4;
    const tickStart = livesX - (3 * tickW + 2 * tickGap);
    for (let i = 0; i < 3; i++) {
        const cx = tickStart + i * (tickW + tickGap);
        if (i < G.lives) {
            ctx.fillStyle = UI.accent;
            ctx.fillRect(cx, 18, tickW, 8);
        } else {
            ctx.strokeStyle = UI.ink3; ctx.lineWidth = 1;
            ctx.strokeRect(cx + 0.5, 18.5, tickW - 1, 7);
        }
    }
    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('LIFE', tickStart - 8, 22);

    // score - large, left
    ctx.font = `600 32px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(`${G.score}`.padStart(4, '0'), padX, 96);

    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.fillText('SCORE', padX, 110);

    // progress bar (right block)
    const bx = padX + 110, by = 80, bw = W - padX*2 - 110, bh = 4;
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(bx, by, bw, bh);
    const prog = Math.min(G.stagePts / STAGES[G.si].target, 1);
    ctx.fillStyle = UI.accent;
    ctx.fillRect(bx, by, Math.max(bw*prog, 2), bh);

    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'left';
    ctx.fillText('TARGET', bx, by - 6);
    ctx.textAlign = 'right';
    ctx.fillText(`${Math.floor(prog*100)}%`, bx + bw, by - 6);

    // stage flash callout (rect, hard edges)
    if (G.stageFlash > 0) {
        const elapsed = STAGE_FLASH_FRAMES - G.stageFlash;
        let slideY = 0;
        if (elapsed < STAGE_FLASH_SLIDE) slideY = (1 - elapsed / STAGE_FLASH_SLIDE) * 60;
        const alpha = G.stageFlash < STAGE_FLASH_SLIDE ? G.stageFlash / STAGE_FLASH_SLIDE : 1;
        const msg = STAGE_UP_MSG[G.stageFlashMsg] || '';
        const bw2 = Math.min(W - 32, 320), bh2 = 72;
        const cx = W/2, cy = H - 110 + slideY;
        ctx.save();
        ctx.globalAlpha = alpha;

        // accent border
        ctx.fillStyle = UI.bg1;
        ctx.fillRect(cx - bw2/2, cy - bh2/2, bw2, bh2);
        ctx.strokeStyle = UI.accent; ctx.lineWidth = 1;
        ctx.strokeRect(cx - bw2/2 + 0.5, cy - bh2/2 + 0.5, bw2 - 1, bh2 - 1);

        ctx.font = `500 10px ${UI.fontMono}`;
        ctx.fillStyle = UI.accent;
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText(`STAGE ${G.si+1}  //  SPEED UP`, cx - bw2/2 + 12, cy - bh2/2 + 10);

        ctx.font = `500 16px ${UI.fontJa}`;
        ctx.fillStyle = UI.ink0;
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(msg, cx - bw2/2 + 12, cy + bh2/2 - 14);
        ctx.restore();
    }

    // combo bar (bottom)
    if (G.combo > 1) {
        const cy = H - 32;
        const cw = Math.min(W - 32, 240);
        const cx = W/2 - cw/2;
        ctx.font = `500 10px ${UI.fontMono}`;
        ctx.fillStyle = UI.accent;
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
        ctx.fillText('COMBO', cx, cy - 8);
        ctx.font = `600 14px ${UI.fontDisp}`;
        ctx.textAlign = 'right';
        ctx.fillStyle = UI.ink0;
        ctx.fillText(`×${G.combo}`, cx + cw, cy - 8);
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(cx, cy, cw, 2);
        ctx.fillStyle = UI.accent;
        ctx.fillRect(cx, cy, cw * (G.combo / 8), 2);
    }

    // slow indicator
    if (G.slowTimer > 0) {
        ctx.font = `500 10px ${UI.fontMono}`;
        ctx.fillStyle = '#6EE7B7';
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText(`SLOW  ${(G.slowTimer/60).toFixed(1)}s`, W - padX, 132);
    }

    // pause btn (top-right corner) — drawn as a small 2-bar icon inside a square
    const pbX = W - padX - PAUSE_BTN.size, pbY = H - padX - PAUSE_BTN.size;
    ctx.strokeStyle = UI.line2; ctx.lineWidth = 1;
    ctx.strokeRect(pbX + 0.5, pbY + 0.5, PAUSE_BTN.size - 1, PAUSE_BTN.size - 1);
    ctx.fillStyle = UI.ink1;
    ctx.fillRect(pbX + 14, pbY + 12, 3, 16);
    ctx.fillRect(pbX + 22, pbY + 12, 3, 16);
    G._pauseBtn = { x: pbX + PAUSE_BTN.size/2, y: pbY + PAUSE_BTN.size/2, w: PAUSE_BTN.size, h: PAUSE_BTN.size };
}

// ── Reticle ───────────────────────────────────────────────
let cursorX = -999, cursorY = -999;
function drawReticle(targetLock = false) {
    const tint = tintedReticle(targetLock ? UI.accent2 : UI.accent);
    if (!tint || cursorX < 0) return;
    const s = RETICLE_SIZE;
    ctx.save();
    ctx.globalAlpha = 0.95;
    ctx.shadowColor = targetLock ? UI.accent2 : UI.accent;
    ctx.shadowBlur = 18;
    ctx.drawImage(tint, cursorX - s/2, cursorY - s/2, s, s);
    ctx.restore();
    ctx.fillStyle = targetLock ? UI.accent2 : UI.accent;
    ctx.beginPath(); ctx.arc(cursorX, cursorY, 2, 0, Math.PI*2); ctx.fill();
}

// ── Loading ───────────────────────────────────────────────
function drawLoading() {
    ctx.fillStyle = UI.bg0;
    ctx.fillRect(0, 0, W, H);
    // brand
    ctx.font = `600 28px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('Sky', W/2 - 38, H*0.45);
    ctx.font = `500 italic 28px ${UI.fontDisp}`;
    ctx.fillStyle = UI.accent;
    ctx.fillText('Burst.', W/2 + 28, H*0.45);
    // progress bar
    const bx = W*0.2, by = H*0.55, bw = W*0.6;
    ctx.strokeStyle = UI.line; ctx.strokeRect(bx + 0.5, by + 0.5, bw, 2);
    ctx.fillStyle = UI.accent;
    const p = Math.min(G.frame / LOADING_FRAMES, 1);
    ctx.fillRect(bx, by, bw * p, 3);
    // text
    const dots = '.'.repeat((Math.floor(G.frame/12) % 4));
    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.fillText(`${CONFIG.loading.text}${dots}`, W/2, H*0.62);
}

// ── Video fit ─────────────────────────────────────────────
function drawVideoFit(video) {
    if (!video || video.readyState < 2) {
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); return;
    }
    ctx.save();
    ctx.filter = 'blur(24px)';
    ctx.drawImage(video, -30, -30, W + 60, H + 60);
    ctx.filter = 'none';
    ctx.restore();
    const size = Math.min(W, H);
    ctx.drawImage(video, (W - size) / 2, (H - size) / 2, size, size);
}

// ── Intro ─────────────────────────────────────────────────
const INTRO_BALLOONS = Array.from({length: 12}, (_, i) => ({
    x: 0.08 + (i % 6) * 0.17,
    delay: i * 9,
    emoji: ['🎈','🎈','🎁','💕','🎈','🕶️'][i % 6],
    size: 28 + (i % 3) * 10,
}));
function drawIntro() {
    const f = G.frame;
    if (G.introSub === 'video') { drawVideoFit(introVideo); return; }
    if (G.introSub === 'fade') {
        const t = Math.min(G.introFade / INTRO_FADE_FRAMES, 1);
        drawVideoFit(introVideo);
        ctx.fillStyle = `rgba(5,7,20,${t})`;
        ctx.fillRect(0, 0, W, H);
        return;
    }
    const alpha = f < INTRO_BALLOON_FADEIN ? f / INTRO_BALLOON_FADEIN
                : f > INTRO_BALLOON_FRAMES - INTRO_BALLOON_FADEOUT
                    ? Math.max(0, (INTRO_BALLOON_FRAMES - f) / INTRO_BALLOON_FADEOUT)
                    : 1;
    ctx.fillStyle = UI.bg0; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = alpha;

    // rising emoji items
    INTRO_BALLOONS.forEach(b => {
        const prog = Math.max(0, Math.min(1, (f - b.delay) / 80));
        if (prog <= 0) return;
        const y = H + b.size - (H + b.size*2) * prog;
        const wob = Math.sin((f - b.delay) * 0.06) * 8;
        ctx.font = `${b.size}px serif`;
        ctx.textAlign = 'center';
        ctx.fillText(b.emoji, b.x*W + wob, y);
    });

    if (f > 30) {
        const ta = Math.min(1, (f - 30)/30);
        ctx.globalAlpha = alpha * ta;

        // Title — same language as title screen
        ctx.font = `500 11px ${UI.fontMono}`;
        ctx.fillStyle = UI.accent;
        ctx.textAlign = 'center';
        ctx.fillText('[ A FAN GAME · HBD 42 ]', W/2, H*0.36);

        ctx.font = `600 56px ${UI.fontDisp}`;
        ctx.fillStyle = UI.ink0;
        ctx.fillText('Sky', W/2 - 50, H*0.46);
        ctx.font = `500 italic 56px ${UI.fontDisp}`;
        ctx.fillStyle = UI.accent;
        ctx.fillText('Burst.', W/2 + 40, H*0.46);

        ctx.font = `500 14px ${UI.fontJa}`;
        ctx.fillStyle = UI.ink1;
        ctx.fillText(CONFIG.intro.line2 || '', W/2, H*0.55);
    }
    ctx.globalAlpha = 1;
}

// ── Title ─────────────────────────────────────────────────
function drawTitleImg() {
    const img = (gameCleared && titleImgCleared?.complete && titleImgCleared.naturalWidth > 0)
        ? titleImgCleared : titleImg;
    if (!img || !img.complete || img.naturalWidth === 0) return;
    // larger, anchored bottom-center, fully opaque (mascot as the hero)
    const targetW = W * 1.0;
    const scale = targetW / img.naturalWidth;
    const targetH = img.naturalHeight * scale;
    const x = (W - targetW) / 2;
    const y = H - targetH * 0.92;
    ctx.drawImage(img, x, y, targetW, targetH);
}

function drawTitle() {
    // Title always uses the deep-night background, regardless of stage state
    const c1 = '#0a0520', c2 = '#1a0535';
    const tgrad = ctx.createLinearGradient(0, 0, 0, H);
    tgrad.addColorStop(0, c1);
    tgrad.addColorStop(1, c2);
    ctx.fillStyle = tgrad;
    ctx.fillRect(0, 0, W, H);

    // accent glow at the bottom
    const tgh = ctx.createRadialGradient(W/2, H, 0, W/2, H, H*0.6);
    tgh.addColorStop(0, hexA(UI.accent, 0.10));
    tgh.addColorStop(1, hexA(UI.accent, 0));
    ctx.fillStyle = tgh;
    ctx.fillRect(0, H*0.5, W, H*0.5);

    // grid + stars
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    const gx = Math.max(60, W / 9), gy = Math.max(80, H / 14);
    for (let x = gx; x < W; x += gx) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = gy; y < H; y += gy) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    G.stars.forEach(s => {
        const a = Math.sin(G.frame * 0.04 + s.ph) * 0.35 + 0.55;
        ctx.globalAlpha = a * 0.55;
        ctx.beginPath();
        ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
        ctx.fillStyle = '#FFF'; ctx.fill();
    });
    ctx.globalAlpha = 1;

    drawTitleImg();

    const padX = 20;

    // top hairline + meta
    hairline(padX, 56, W - padX, 56, UI.line);
    ctx.fillStyle = UI.accent;
    ctx.beginPath(); ctx.arc(padX + 4, 22, 4, 0, Math.PI*2); ctx.fill();
    ctx.save();
    ctx.shadowColor = UI.accent; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(padX + 4, 22, 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('SKY BURST', padX + 14, 22);
    ctx.textAlign = 'right';
    ctx.fillText(gameCleared ? 'CLEARED · v1.0' : 'v1.0', W - padX, 22);

    // Title block — eyebrow with pulsing dot
    const pulse = 0.5 + Math.sin(G.frame * 0.08) * 0.3;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = UI.accent2;
    ctx.beginPath(); ctx.arc(padX + 4, 96, 3, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.font = `600 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.accent2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('LIVE · A FAN GAME FOR 42', padX + 14, 96);

    // Big wordmark with subtle parallax
    const drift = Math.sin(G.frame * 0.02) * 2;
    ctx.font = `700 72px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('Sky', padX, 168 + drift);

    ctx.save();
    ctx.font = `500 italic 72px ${UI.fontDisp}`;
    ctx.shadowColor = hexA(UI.accent, 0.6);
    ctx.shadowBlur = 20;
    ctx.fillStyle = UI.accent;
    ctx.fillText('Burst.', padX, 232 + drift);
    ctx.restore();

    // Subtitle row with version tag
    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.fillText('FPS · BALLOON BUSTER', padX, 262);
    const tagW = 44, tagH = 20, tagX = W - padX - tagW, tagY = 248;
    ctx.strokeStyle = UI.line2; ctx.lineWidth = 1;
    ctx.strokeRect(tagX + 0.5, tagY + 0.5, tagW - 1, tagH - 1);
    ctx.font = `600 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.accent;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(':42', tagX + tagW/2, tagY + tagH/2 + 1);
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    hairline(padX, 278, W - padX, 278);

    // Rules block — with dim plate behind for legibility over mascot
    const rules = CONFIG.title.instructions;
    const lineH = 30;
    const rTop = H * 0.36;
    const rH = lineH * rules.length + 36;

    ctx.save();
    const grad = ctx.createLinearGradient(0, rTop - 24, 0, rTop + rH + 8);
    grad.addColorStop(0, hexA(UI.bg0, 0));
    grad.addColorStop(0.18, hexA(UI.bg0, 0.78));
    grad.addColorStop(0.82, hexA(UI.bg0, 0.78));
    grad.addColorStop(1, hexA(UI.bg0, 0));
    ctx.fillStyle = grad;
    ctx.fillRect(0, rTop - 24, W, rH + 32);
    ctx.restore();

    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('HOW TO PLAY', padX, rTop - 6);

    rules.forEach((r, i) => {
        const y = rTop + i * lineH;
        hairline(padX, y, W - padX, y);
        if (i === rules.length - 1) hairline(padX, y + lineH, W - padX, y + lineH);
        ctx.font = `500 10px ${UI.fontMono}`;
        ctx.fillStyle = UI.ink2;
        ctx.textBaseline = 'middle';
        ctx.fillText(String(i+1).padStart(2, '0'), padX + 4, y + lineH/2);
        ctx.font = `400 13px ${UI.fontJa}`;
        ctx.fillStyle = i === 2 ? UI.accent2 : UI.ink1;
        ctx.fillText(r, padX + 32, y + lineH/2);
    });

    // START button — hard-edged accent rect
    const bw = W - padX*2, bh = 56;
    const bx = padX, by = H - 110;
    G._titleBtnY = by + bh/2;
    G._titleBtnW = bw;
    G._titleBtnH = bh;

    ctx.save();
    ctx.shadowColor = hexA(UI.accent, 0.5);
    ctx.shadowBlur = 30;
    ctx.fillStyle = UI.accent;
    rrect(bx, by, bw, bh, 4); ctx.fill();
    ctx.restore();

    ctx.font = `600 18px ${UI.fontDisp}`;
    ctx.fillStyle = UI.bg0;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    let cx = bx + 24;
    for (const ch of 'START') {
        ctx.fillText(ch, cx, by + bh/2);
        cx += ctx.measureText(ch).width + 4;
    }
    // arrow
    const ax = bx + bw - 28, ay = by + bh/2;
    ctx.strokeStyle = UI.bg0; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax - 22, ay); ctx.lineTo(ax + 6, ay); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ax - 4, ay - 8); ctx.lineTo(ax + 6, ay); ctx.lineTo(ax - 4, ay + 8);
    ctx.stroke();

    // sub-label below
    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('TAP / CLICK / SPACE', W/2, by + bh + 18);

    // bottom meta
    hairline(padX, H - 38, W - padX, H - 38);
    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink3;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('AIM · POP', padX, H - 22);
    ctx.textAlign = 'center';
    ctx.fillText('FOR THE BIRTHDAY BOY · 42', W/2, H - 22);
    ctx.textAlign = 'right';
    ctx.fillText('BEST · 128', W - padX, H - 22);

    // intro fade overlay
    if (G.titleFade < TITLE_FADE_FRAMES) {
        ctx.fillStyle = `rgba(5,7,20,${1 - G.titleFade / TITLE_FADE_FRAMES})`;
        ctx.fillRect(0, 0, W, H);
    }

    // reset btn for cleared state
    if (gameCleared) {
        ctx.globalAlpha = 0.4;
        ctx.font = `500 14px ${UI.fontMono}`;
        ctx.fillStyle = UI.ink1;
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText('↻', W - 16, H - 56);
        ctx.globalAlpha = 1;
    }
}

// ── Starting (countdown callout) ──────────────────────────
function drawStarting() {
    drawBg();
    drawTitleImg();
    if (G.frame < START_WAIT_FRAMES) return;
    const elapsed = G.frame - START_WAIT_FRAMES;
    const slideF = START_SLIDE_FRAMES;
    const slideY = elapsed < slideF ? (1 - elapsed / slideF) * 60 : 0;
    const alpha  = elapsed < slideF ? elapsed / slideF : 1;
    const msg = 'いっくよー！';
    const bw = Math.min(W - 32, 280), bh = 72;
    const cx = W/2, cy = H*0.55 + slideY;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = UI.bg1;
    ctx.fillRect(cx - bw/2, cy - bh/2, bw, bh);
    ctx.strokeStyle = UI.accent; ctx.lineWidth = 1;
    ctx.strokeRect(cx - bw/2 + 0.5, cy - bh/2 + 0.5, bw - 1, bh - 1);
    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.accent;
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('STAGE 1  //  GO', cx - bw/2 + 12, cy - bh/2 + 10);
    ctx.font = `500 18px ${UI.fontJa}`;
    ctx.fillStyle = UI.ink0;
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(msg, cx - bw/2 + 12, cy + bh/2 - 14);
    ctx.restore();
}

// ── Game render ───────────────────────────────────────────
function drawGame() {
    drawBg();
    G.items.forEach(it => { if (!it.popped) drawBalloon(it); });
    G.particles.forEach(p => {
        ctx.globalAlpha = p.life;
        if (p.type === 'text') {
            ctx.font = `600 13px ${UI.fontMono}`;
            ctx.fillStyle = p.color;
            ctx.textAlign = 'center';
            ctx.fillText(p.text, p.x, p.y);
        } else {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fillStyle = p.color; ctx.fill();
        }
        ctx.globalAlpha = 1;
    });
    drawHUD();

    // target lock when reticle is over a hazard
    let lock = false;
    for (const it of G.items) {
        if (it.popped || !it.def.hazard) continue;
        const dx = cursorX - it.x, dy = cursorY - it.y;
        if (dx*dx + dy*dy < R*R*1.8) { lock = true; break; }
    }
    drawReticle(lock);
}

function drawOverlay(alpha = 0.85) {
    ctx.fillStyle = hexA(UI.bg0, alpha);
    ctx.fillRect(0, 0, W, H);
}

// ── Pause ─────────────────────────────────────────────────
function drawPaused() {
    drawGame();
    drawOverlay(0.78);
    const padX = 20;

    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.accent;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('[ PAUSED ]', padX, H*0.32);

    ctx.font = `600 48px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.fillText('On hold.', padX, H*0.32 + 60);

    hairline(padX, H*0.42 + 40, W - padX, H*0.42 + 40);

    // resume btn
    const bw = W - padX*2, bh = 52;
    const rby = H*0.55;
    G._pauseResumeY = rby + bh/2;
    G._pauseQuitY = rby + bh + 16 + bh/2;

    ctx.save();
    ctx.shadowColor = hexA(UI.accent, 0.4);
    ctx.shadowBlur = 24;
    ctx.fillStyle = UI.accent;
    rrect(padX, rby, bw, bh, 4); ctx.fill();
    ctx.restore();
    ctx.font = `600 16px ${UI.fontDisp}`;
    ctx.fillStyle = UI.bg0;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('RESUME', W/2, rby + bh/2);

    // quit btn
    const qy = rby + bh + 16;
    ctx.strokeStyle = UI.line2; ctx.lineWidth = 1;
    ctx.strokeRect(padX + 0.5, qy + 0.5, bw - 1, bh - 1);
    ctx.font = `500 14px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink1;
    ctx.fillText('QUIT TO TITLE', W/2, qy + bh/2);

    drawReticle(false);
}

// ── Ending ────────────────────────────────────────────────
function drawEnding() {
    drawBg();
    // hard reset of canvas state to avoid any leak from prior frames
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    ctx.filter = 'none';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';

    // confetti
    G.confetti.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y); ctx.rotate(c.rot);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
        ctx.restore();
    });

    // bouncers (background mascot fragments)
    G.bouncers.forEach((b, bi) => {
        const cand = bouncerImgs[bi];
        const img = (cand && cand.complete && cand.naturalWidth > 0) ? cand
                  : (titleImg && titleImg.complete && titleImg.naturalWidth > 0) ? titleImg
                  : null;
        ctx.save();
        ctx.globalAlpha = 0.85;
        if (img) {
            const r = b.size / 2;
            ctx.beginPath();
            ctx.rect(b.x - r, b.y - r, b.size, b.size);
            ctx.clip();
            ctx.drawImage(img, b.x - r, b.y - r, b.size, b.size);
            ctx.strokeStyle = UI.accent;
            ctx.lineWidth = 1;
            ctx.strokeRect(b.x - r + 0.5, b.y - r + 0.5, b.size - 1, b.size - 1);
        }
        ctx.restore();
    });

    G.particles.forEach(p => {
        ctx.globalAlpha = p.life;
        if (p.type !== 'text') {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fillStyle = p.color; ctx.fill();
        }
        ctx.globalAlpha = 1;
    });

    const padX = 20;

    // top hairline + meta
    hairline(padX, 56, W - padX, 56);
    ctx.fillStyle = UI.accent;
    ctx.beginPath(); ctx.arc(padX + 4, 22, 4, 0, Math.PI*2); ctx.fill();
    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('SKY BURST  ·  CLEARED', padX + 14, 22);
    ctx.textAlign = 'right';
    ctx.fillText('PERFECT 42', W - padX, 22);

    // Hero text
    ctx.font = `500 11px ${UI.fontMono}`;
    ctx.fillStyle = UI.accent;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('[ CONGRATULATIONS ]', padX, H * 0.13);

    ctx.font = `600 56px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.fillText('Happy', padX, H * 0.20);
    ctx.font = `500 italic 56px ${UI.fontDisp}`;
    ctx.fillStyle = UI.accent;
    ctx.fillText('42.', padX, H * 0.27);

    ctx.font = `400 14px ${UI.fontJa}`;
    ctx.fillStyle = UI.ink1;
    ctx.fillText(CONFIG.ending.message, padX, H * 0.31);
    hairline(padX, H * 0.33, W - padX, H * 0.33);

    // Score row
    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('FINAL SCORE', padX, H * 0.38);
    ctx.font = `600 56px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.fillText(`${G.score}`.padStart(4, '0'), padX, H * 0.45);

    // Stats grid
    const sy = H * 0.50;
    ctx.font = `500 10px ${UI.fontMono}`;
    ctx.fillStyle = UI.ink2;
    ctx.fillText('STAGES CLEARED', padX, sy);
    ctx.fillText('STATUS', W/2, sy);
    ctx.font = `600 22px ${UI.fontDisp}`;
    ctx.fillStyle = UI.ink0;
    ctx.fillText(`${STAGES.length}/${STAGES.length}`, padX, sy + 28);
    ctx.fillStyle = UI.accent;
    ctx.fillText('PERFECT', W/2, sy + 28);
    hairline(padX, sy + 48, W - padX, sy + 48);

    // Replay btn
    const bw = W - padX*2, bh = 56;
    const by = H - 150;
    G._replayY = by + bh/2;
    ctx.save();
    ctx.shadowColor = hexA(UI.accent, 0.5);
    ctx.shadowBlur = 30;
    ctx.fillStyle = UI.accent;
    rrect(padX, by, bw, bh, 4); ctx.fill();
    ctx.restore();
    ctx.font = `600 18px ${UI.fontDisp}`;
    ctx.fillStyle = UI.bg0;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('PLAY AGAIN', W/2, by + bh/2);
}

// ── Update ────────────────────────────────────────────────
function update() {
    if (G.phase === 'paused') return;
    G.frame++;

    if (G.phase === 'loading') {
        if (G.frame >= LOADING_FRAMES) {
            G.phase = 'intro';
            G.introSub = introVideo ? 'video' : 'balloons';
            G.frame = 0;
            G.introFade = 0;
            if (introVideo) introVideo.play().catch(() => { introVideoEnded = true; });
        }
        return;
    }
    if (G.phase === 'intro') {
        if (G.introSub === 'video') {
            if (introVideoEnded) { G.introSub = 'fade'; G.introFade = 0; }
        } else if (G.introSub === 'fade') {
            G.introFade++;
            if (G.introFade >= INTRO_FADE_FRAMES) { G.phase = 'title'; G.frame = 0; G.titleFade = 0; }
        } else {
            // skip balloon intro entirely
            G.phase = 'title'; G.frame = 0; G.titleFade = 0;
        }
        return;
    }
    if (G.phase === 'title') {
        if (G.titleFade < TITLE_FADE_FRAMES) G.titleFade++;
    }
    if (G.phase === 'starting') {
        if (G.frame >= START_TOTAL_FRAMES) { G.phase = 'playing'; G.frame = 0; }
    }
    if (G.phase === 'playing') {
        const stage = STAGES[G.si];
        if (G.frame % stage.interval === 0) {
            spawnItem();
            if (G.si >= 1 && G.frame % (stage.interval*2) === 0) spawnItem();
        }
        G.items = G.items.filter(it => {
            if (it.popped) return false;
            it.y += it.vy; it.x += it.vx;
            it.wobble += 0.025;
            it.x += Math.sin(it.wobble) * 0.35;
            return it.y > -R*3;
        });
        if (G.combo > 1 && Date.now() - G.lastPop > COMBO_MS) G.combo = 1;
        if (G.bgT < 1) G.bgT = Math.min(G.bgT + 0.018, 1);
        if (G.stageFlash > 0) G.stageFlash--;
        if (G.slowTimer > 0) G.slowTimer--;
    }
    if (G.phase === 'ending') {
        G.confetti.forEach(c => {
            c.x += c.vx; c.y += c.vy; c.rot += c.rotV;
            if (c.y > H + 20) { c.y = -10; c.x = Math.random()*W; }
        });
        if (G.frame % 75 === 0) {
            const cols = [UI.accent, UI.accent2, '#FFD700', '#A78BFA'];
            burst(Math.random()*W, Math.random()*H*0.6, cols[G.frame%cols.length], 18);
        }
        G.bouncers.forEach((b, bi) => {
            if (b.x === 0) { b.x = W*(0.3 + bi*0.4); b.y = H*0.3; }
            b.x += b.vx; b.y += b.vy;
            b.vy += 0.10;
            const r = b.size/2;
            if (b.x - r < 0)  { b.x = r;   b.vx =  Math.abs(b.vx)*0.92; }
            if (b.x + r > W)  { b.x = W-r; b.vx = -Math.abs(b.vx)*0.92; }
            if (b.y - r < 0)  { b.y = r;   b.vy =  Math.abs(b.vy)*0.85; }
            if (b.y + r > H)  { b.y = H-r; b.vy = -Math.abs(b.vy)*0.88;
                                b.vx += (Math.random()-0.5)*1.5; }
        });
    }
    G.particles = G.particles.filter(p => {
        p.life -= p.type === 'text' ? 0.014 : 0.028;
        p.x += p.vx; p.y += p.vy;
        if (p.type !== 'text') { p.vy += 0.12; p.vx *= 0.97; }
        return p.life > 0;
    });
}

// ── Render dispatch ───────────────────────────────────────
function render() {
    ctx.clearRect(0, 0, W, H);
    canvas.style.cursor = (G.phase === 'playing' || G.phase === 'paused') ? 'none' : '';
    switch(G.phase) {
        case 'loading':  drawLoading();  break;
        case 'intro':    drawIntro();    break;
        case 'title':    drawTitle();    break;
        case 'starting': drawStarting(); break;
        case 'playing':  drawGame();     break;
        case 'paused':   drawPaused();   break;
        case 'gameOver': drawGameOver(); break;
        case 'ending':   drawEnding();   break;
    }
}
function loop() { update(); render(); requestAnimationFrame(loop); }

// ── Input ─────────────────────────────────────────────────
function getXY(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = W / rect.width, sy = H / rect.height;
    const src = e.touches ? e.touches[0] : e;
    return { x: (src.clientX - rect.left) * sx, y: (src.clientY - rect.top) * sy };
}
function inRect(x, y, cx, cy, w, h) {
    return Math.abs(x-cx) < w/2 && Math.abs(y-cy) < h/2;
}

function onInput(e) {
    e.preventDefault();
    const { x, y } = getXY(e);
    switch(G.phase) {
        case 'title':
            if (inRect(x, y, W/2, G._titleBtnY ?? H*0.85, G._titleBtnW ?? W-40, G._titleBtnH ?? 56)) {
                G.phase = 'starting'; G.frame = 0;
            } else if (gameCleared && inRect(x, y, W - 16, H - 56, 36, 36)) {
                resetCleared();
            }
            break;
        case 'playing':
            if (G._pauseBtn && inRect(x, y, G._pauseBtn.x, G._pauseBtn.y, G._pauseBtn.w, G._pauseBtn.h)) {
                G.phase = 'paused';
            } else { tryPop(x, y); }
            break;
        case 'paused':
            if (inRect(x, y, W/2, G._pauseResumeY ?? H*0.55, W - 40, 52)) G.phase = 'playing';
            else if (inRect(x, y, W/2, G._pauseQuitY ?? H*0.65, W - 40, 52)) replayState();
            break;
        case 'gameOver':
            if (inRect(x, y, W/2, G._retryY ?? H*0.85, W - 40, 52)) replayState();
            break;
        case 'ending':
            if (inRect(x, y, W/2, G._replayY ?? H*0.85, W - 40, 56)) replayState();
            break;
    }
}
canvas.addEventListener('click', onInput);
canvas.addEventListener('touchstart', onInput, { passive: false });

// debug shortcuts: E=ending, O=gameover, T=title, P=playing
window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'e') {
        G.score = 6000; G.si = STAGES.length - 1; G.stagePts = STAGES[G.si].target;
        spawnConfetti(); setCleared(); G.phase = 'ending'; G.frame = 0;
    } else if (k === 'o') {
        G.score = 1234; G.lives = 0; G.phase = 'gameOver';
    } else if (k === 't') {
        replayState();
    } else if (k === 'p') {
        G.phase = 'playing'; G.frame = 0;
    } else if (k === ' ' || k === 'enter') {
        if (G.phase === 'title') { G.phase = 'starting'; G.frame = 0; }
    }
});

function updateCursor(e) {
    const rect = canvas.getBoundingClientRect();
    const sx = W / rect.width, sy = H / rect.height;
    const src = e.touches ? e.touches[0] : e;
    if (src) { cursorX = (src.clientX - rect.left)*sx; cursorY = (src.clientY - rect.top)*sy; }
}
canvas.addEventListener('mousemove', updateCursor);
canvas.addEventListener('touchmove', updateCursor, { passive: true });
canvas.addEventListener('mouseleave', () => { cursorX = -999; cursorY = -999; });

function replayState() { initState(); G.phase = 'title'; G.frame = 0; }
initState();
loop();
</script>
</body>
